apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: aep-console
endpoints:
  - name: http
    type: HTTP
    port: 3000
    visibility:
      - external
dependencies:
  endpoints:
    - component: aep-api
      name: http
      visibility: project
      envBindings:
        address: AEP_API_PROXY_URL
