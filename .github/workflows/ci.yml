name: CI

on:
  push:
    branches: [aep-rewrite]
  pull_request:
    branches: [aep-rewrite]

jobs:
  # ── Detect which paths changed ───────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-images: ${{ steps.set-matrix.outputs.has-images }}
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aep-server:
              - 'tools/aepctl/**'
            aep-api:
              - 'services/aep-api/**'
            agents:
              - 'services/agents/**'
              - 'packages/**'
            console:
              - 'apps/console/**'
              - 'packages/**'
            remote-worker:
              - 'runners/remote-worker/**'
            cluster-gateway-proxy:
              - 'deployments/local-cluster-gateway-proxy/**'
            go:
              - 'services/aep-api/**'
              - 'tools/aepctl/**'
              - 'deployments/single-cluster/resource-types/**'
              - 'go.work'
              - 'go.work.sum'
            ts:
              - 'apps/**'
              - 'services/agents/**'
              - 'services/collab/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'

      - id: set-matrix
        run: |
          ALL='{
            "aep-server":   {"dockerfile":"tools/aepctl/Dockerfile.server","context":"tools/aepctl"},
            "aep-api":      {"dockerfile":"services/aep-api/Dockerfile","context":"services/aep-api"},
            "agents":       {"dockerfile":"services/agents/Dockerfile","context":"."},
            "remote-worker":{"dockerfile":"runners/remote-worker/Dockerfile","context":"runners/remote-worker"},
            "console":      {"dockerfile":"apps/console/Dockerfile","context":"."},
            "cluster-gateway-proxy":{"dockerfile":"deployments/local-cluster-gateway-proxy/Dockerfile","context":"deployments/local-cluster-gateway-proxy"}
          }'
          CHANGES='${{ steps.filter.outputs.changes }}'
          matrix=$(echo "$CHANGES" | jq -c --argjson all "$ALL" \
            '[.[] | {name: ., dockerfile: $all[.].dockerfile, context: $all[.].context}]')
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          if [ "$CHANGES" = "[]" ]; then
            echo "has-images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build changed images (no push) ──────────────────────────────────────────
  build-images:
    name: Build ${{ matrix.name }} image
    needs: changes
    if: needs.changes.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── Go build + test (only when Go files change) ─────────────────────────────
  go-checks:
    name: Go build + test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Build all Go modules
        run: go build ./...

      - name: Test all Go modules
        run: go test ./...

  # ── TypeScript typecheck + test (only when TS files change) ─────────────────
  ts-checks:
    name: TypeScript typecheck + test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test
