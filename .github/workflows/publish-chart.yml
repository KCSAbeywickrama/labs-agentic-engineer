name: Publish Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "deployments/helm-charts/**"
      - "deployments/single-cluster/resource-types/thunder-app/operator/helm/**"
      - ".github/workflows/publish-chart.yml"

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  CHART_DIR: deployments/helm-charts/platform
  # Must match the OCI path hardcoded in aectl platform install (platform.go).
  CHART_NAMESPACE: oci://ghcr.io/wso2/aep/charts

jobs:
  publish:
    name: Package and push chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Package chart
        run: helm package ${{ env.CHART_DIR }} -d /tmp/chart-output

      - name: Package thunder-app-operator chart
        run: helm package deployments/single-cluster/resource-types/thunder-app/operator/helm -d /tmp/chart-output

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Push aep-platform chart
        run: helm push /tmp/chart-output/aep-platform-*.tgz ${{ env.CHART_NAMESPACE }}

      - name: Push thunder-app-operator chart
        run: helm push /tmp/chart-output/thunder-app-operator-*.tgz oci://${{ env.REGISTRY }}/${{ env.OWNER }}
