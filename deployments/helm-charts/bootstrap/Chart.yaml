apiVersion: v2
name: aep-bootstrap
description: >
  Phase 1 install: deploys OpenBao (secrets backend) and the AEP management
  server. After this, run `aep init` to provision all secrets, then install
  aep-platform (wso2-ae-platform chart) for the full platform.
version: 0.0.0-dev
appVersion: 0.0.0-dev
keywords:
  - wso2
  - agentic-engineer
  - openchoreo
dependencies:
  - name: openbao
    repository: https://openbao.github.io/openbao-helm
    version: "0.28.4"
    alias: aep-openbao
