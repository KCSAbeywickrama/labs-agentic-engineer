apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aep-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aep-server
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aep
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - {{ .Values.aepServer.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /aep.admin.v1.AEPAdmin/
      backendRefs:
        - name: aep-server
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.aepServer.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aep-server
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.aepServer.port }}
