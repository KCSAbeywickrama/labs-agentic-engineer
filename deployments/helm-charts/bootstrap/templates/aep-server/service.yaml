apiVersion: v1
kind: Service
metadata:
  name: aep-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aep-server
    app.kubernetes.io/part-of: aep
spec:
  selector:
    app.kubernetes.io/name: aep-server
  ports:
    - name: grpc
      port: {{ .Values.aepServer.port }}
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
  type: ClusterIP
