apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-server
  labels:
    app.kubernetes.io/name: aep-server
    app.kubernetes.io/part-of: aep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-server
subjects:
  - kind: ServiceAccount
    name: aep-server
    namespace: {{ .Release.Namespace }}
