---
# HTTPRoute in the OC control-plane gateway namespace to expose the BFF externally.
# The ReferenceGrant in templates/reference-grant.yaml allows this cross-namespace reference.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: asdlc-api
  namespace: {{ .Values.ocGateway.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
spec:
  parentRefs:
    - name: {{ .Values.ocGateway.name }}
      namespace: {{ .Values.ocGateway.namespace }}
  hostnames:
    - {{ .Values.asdlcApi.hostname | quote }}
  rules:
    - backendRefs:
        - name: asdlc-api
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.asdlcApi.port }}
      matches:
{{- if .Values.asdlcApi.internalHostname }}
        # Browser/public surface only — /internal moves to the internal host
        # below. /api covers the webhook + connect-callback (they sit under
        # /api/v1 by their more-specific in-process patterns).
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /healthz
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /openapi
{{- else }}
        - path:
            type: PathPrefix
            value: /
{{- end }}
{{- if .Values.asdlcApi.internalHostname }}
---
# Dedicated internal service-to-service host. Serves ONLY /internal, off the
# public browser surface; the runner pod reaches it via AGENT_PLATFORM_URL
# (bff.internalURL). The auth seam (scope.RunnerScopedInput) is the actual
# security boundary — this host-split is defense-in-depth (design D3).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: asdlc-api-internal
  namespace: {{ .Values.ocGateway.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
spec:
  parentRefs:
    - name: {{ .Values.ocGateway.name }}
      namespace: {{ .Values.ocGateway.namespace }}
  hostnames:
    - {{ .Values.asdlcApi.internalHostname | quote }}
  rules:
    - backendRefs:
        - name: asdlc-api
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.asdlcApi.port }}
      matches:
        - path:
            type: PathPrefix
            value: /internal
{{- end }}
