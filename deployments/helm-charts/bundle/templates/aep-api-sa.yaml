apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-api
  namespace: {{ .Release.Namespace}}
  labels: 
    app.kubernetes.io/managed-by: {{ .Release.Service}} # Ususally helm
    app.kubernetes.io/part-of: wso2-aep
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: 
  name: aep-api
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service}}
    app.kubernetes.io/part-of: wso2-aep
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-api
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service}}
    app.kubernetes.io/part-of: wso2-aep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-api
subjects:
  - kind: ServiceAccount
    name: aep-api
    namespace: {{ .Release.Namespace }}
