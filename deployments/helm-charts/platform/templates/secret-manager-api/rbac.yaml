{{- if .Values.codingAgentDispatch.localStubs.enabled }}
# LOCAL DEV ONLY — see values.yaml codingAgentDispatch.localStubs.
# The secret-manager-api stub writes user-app secrets to OpenBao and authors
# SecretReference CRs across the dynamically-created wc-<org> namespaces.
# It also creates those namespaces when a credential is connected before the
# coding-agent dispatcher has had a chance to create them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-manager-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: secret-manager-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-manager-api
  labels:
    app: secret-manager-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
rules:
  - apiGroups: ["openchoreo.dev"]
    resources: [secretreferences]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-manager-api
  labels:
    app: secret-manager-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-manager-api
subjects:
  - kind: ServiceAccount
    name: secret-manager-api
    namespace: {{ .Release.Namespace }}
{{- end }}
