{{- if .Values.codingAgentDispatch.localStubs.enabled }}
# LOCAL DEV ONLY — see values.yaml codingAgentDispatch.localStubs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-manager-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: secret-manager-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-manager-api
  template:
    metadata:
      labels:
        app: secret-manager-api
        app.kubernetes.io/part-of: wso2-aep
    spec:
      serviceAccountName: secret-manager-api
      containers:
        - name: secret-manager-api
          image: {{ .Values.codingAgentDispatch.secretManagerApi.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.codingAgentDispatch.secretManagerApi.port }}
              name: http
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.codingAgentDispatch.secretManagerApi.port }}"
            - name: LOG_LEVEL
              value: "info"
            # OpenBao dev mode: root token is always "root" — never changes locally.
            # The real sm-api uses k8s-SA vault auth; the stub uses this fixed root
            # token instead (safe for single-tenant local dev only).
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.addr | quote }}
            - name: OPENBAO_TOKEN
              value: "root"
            - name: VAULT_PATH_PREFIX
              value: "user-app-secrets"
            - name: SECRET_REF_PREFIX
              value: "cred-"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
{{- end }}
