{{- if .Values.localOrgProvisioning.enabled }}
# LOCAL ORG PROVISIONING (local stand-in for the cloud org bootstrap).
# Per-org NAMESPACED ProjectType that aep-api references on every project
# create (kind=ProjectType, name=default; see buildCreateProjectBody). Gated
# off in prod: wso2cloud's org bootstrap seeds this per org there. See
# values.yaml localOrgProvisioning.
#
# The spec is the one the wso2cloud bootstrap (bootstrap-version v1.7) seeds,
# which is also OpenChoreo's ClusterProjectType/default from its
# getting-started samples: provision only the cell namespace per environment.
# targetPlane is left to the CRD default (dataplane), as OpenChoreo's sample
# and Agent Manager's chart leave it.
# What differs from the ClusterProjectType is the kind (a namespaced type is
# not shared across orgs) and so the namespace. The cloud copy's
# bootstrap-version and cloud.wso2.com/* labels are that platform's own
# bookkeeping and are left out.
#
# Agent Manager's platform-resources chart renders an identical
# ProjectType/default into the same namespace. This chart owns it;
# setup-agent-manager.sh drops Agent Manager's copy in its post-renderer
# (deployments/agent-manager/platform-resources-post-renderer).
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectType
metadata:
  name: default
  namespace: {{ .Values.localOrgProvisioning.orgNamespace | quote }}
  annotations:
    openchoreo.dev/display-name: "Default Project Type"
    openchoreo.dev/description: "Minimal project type that provisions only the cell namespace per environment."
  labels:
    openchoreo.dev/name: default
spec:
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        namespaceLabels:
          type: object
          additionalProperties:
            type: string
          default: {}
        namespaceAnnotations:
          type: object
          additionalProperties:
            type: string
          default: {}
  resources:
    - id: cell-namespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${metadata.namespace}
          labels: ${oc_merge(metadata.labels, environmentConfigs.namespaceLabels)}
          annotations: ${environmentConfigs.namespaceAnnotations}
{{- end }}
