{{- if .Values.codingAgentDispatch.localStubs.enabled }}
# LOCAL DEV ONLY — see values.yaml codingAgentDispatch.localStubs.
# The cluster-gateway-proxy stub reads coding-agent pod logs + job status on
# aep-api's behalf (live streaming feed + JobWatcher). It authenticates to the
# K8s API with THIS ServiceAccount's token, so the ServiceAccount is granted
# only the read verbs those two consumers exercise, cluster-wide (the
# wc-<org>-remote-worker namespaces are created on demand).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-gateway-proxy
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-gateway-proxy
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-gateway-proxy
subjects:
  - kind: ServiceAccount
    name: cluster-gateway-proxy
    namespace: {{ .Release.Namespace }}
{{- end }}
