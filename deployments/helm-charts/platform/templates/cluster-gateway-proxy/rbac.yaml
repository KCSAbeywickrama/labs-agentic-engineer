{{- if .Values.codingAgentDispatch.localStubs.enabled }}
# LOCAL DEV ONLY — see values.yaml codingAgentDispatch.localStubs.
# The cluster-gateway-proxy stub runs coding-agent dispatch on aep-api's behalf:
# ensure the milestone project's dp-… dataplane namespace + SA, apply per-run
# ExternalSecrets, create the Job, then stream logs / watch Job status. It
# authenticates to the K8s API with THIS ServiceAccount's token, so the role
# covers those write + read verbs cluster-wide (dp-… namespaces are created on demand).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-gateway-proxy
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: ["external-secrets.io"]
    resources: [externalsecrets]
    verbs: [get, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-gateway-proxy
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-gateway-proxy
subjects:
  - kind: ServiceAccount
    name: cluster-gateway-proxy
    namespace: {{ .Release.Namespace }}
{{- end }}
