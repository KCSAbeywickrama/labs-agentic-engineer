{{- if .Values.codingAgentDispatch.localStubs.enabled }}
# LOCAL DEV ONLY — see values.yaml codingAgentDispatch.localStubs.
apiVersion: v1
kind: Service
metadata:
  name: cluster-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  selector:
    app: cluster-gateway-proxy
  ports:
    - name: http
      port: {{ .Values.codingAgentDispatch.clusterGatewayProxy.port }}
      targetPort: http
{{- end }}
