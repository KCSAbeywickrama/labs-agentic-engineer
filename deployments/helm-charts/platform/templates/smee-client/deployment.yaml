{{- if .Values.webhook.localSmee.enabled }}
# LOCAL DEV ONLY — see values.yaml webhook.localSmee.
# Subscribes to the smee.io channel (webhook.deliveryURL) and forwards GitHub
# webhook events to aep-api's receiver. smee.io is a third-party public relay,
# so this must never run in production — prod delivers webhooks to a real HTTPS
# ingress instead. Needs only outbound network + in-cluster POST to aep-api; no
# Kubernetes RBAC.
{{- if not .Values.webhook.deliveryURL }}
{{- fail "webhook.localSmee.enabled=true requires webhook.deliveryURL (your smee.io channel)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smee-client
  namespace: {{ .Release.Namespace }}
  labels:
    app: smee-client
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smee-client
  template:
    metadata:
      labels:
        app: smee-client
        app.kubernetes.io/part-of: wso2-aep
    spec:
      containers:
        - name: smee-client
          image: {{ .Values.webhook.localSmee.image | quote }}
          args:
            - "--url"
            - {{ .Values.webhook.deliveryURL | quote }}
            - "--target"
            - "http://aep-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.aepApi.port }}/api/v1/webhooks/github"
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
{{- end }}
