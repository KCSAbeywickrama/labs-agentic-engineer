apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-agents-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: aep-agents-secrets
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: aep/anthropic-api-key
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: postgres-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: aep/postgres-password
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-task-signing-key
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: aep-task-signing-key
  data:
    - secretKey: task-signing.pem
      remoteRef:
        key: aep/task-signing-key
        property: value
