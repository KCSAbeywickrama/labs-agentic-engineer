apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-agents-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: aep-agents-secrets
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: aep/anthropic-api-key
        property: value
---
