apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: aep-thunder-secrets
  data:
    - secretKey: OC_WORKLOAD_PUBLISHER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-workload-publisher
        property: value
    - secretKey: OC_OBSERVER_READER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-observer-reader
        property: value
    - secretKey: AEP_API_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/aep-api-client
        property: value
    - secretKey: BFF_TO_GIT_SERVICE_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-git-service
        property: value
- secretKey: BFF_TO_REMOTE_WORKER_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-remote-worker
        property: value
    - secretKey: LOCAL_DEV_SEEDER_SECRET
      remoteRef:
        key: aep/thunder-clients/local-dev-seeder
        property: value
    - secretKey: THUNDER_SYSTEM_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/system-client
        property: value
