apiVersion: v1
kind: Service
metadata:
    name: aep-api
    namespace: {{ .Release.Namespace }}
    labels:
        app: aep-api
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/part-of: wso2-aep
spec:
    selector:
        app: aep-api
    ports:
        - port: {{ .Values.aepApi.port }}
          targetPort: http
          protocol: TCP
          name: http
    type: ClusterIP