apiVersion: v1
kind: Service
metadata:
    name: aep-agents
    namespace: {{ .Release.Namespace}}
    labels: 
        app: aep-agents
        app.kubernetes.io/managed-by: {{ .Release.Service}}
        app.kubernetes.io/part-of: wso2-aep
spec:
    selector:
        app: aep-agents
    ports:
        - port: {{ .Values.aepAgents.port}}
          targetPort: http
          protocol: TCP
          name: http
    type: ClusterIP