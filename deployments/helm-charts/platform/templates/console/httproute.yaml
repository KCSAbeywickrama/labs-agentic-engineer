apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aep-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - "console.openchoreo.localhost"
  rules:
    # Route /aep-api-service/* → aep-api, stripping the prefix so the API
    # receives paths like /api/v1/... without the console-side prefix.
    - matches:
        - path:
            type: PathPrefix
            value: /aep-api-service
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: aep-api
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.aepApi.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aep-console
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.console.port }}
