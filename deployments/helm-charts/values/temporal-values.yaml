# Temporal helm values — AEP local k3d labs profile.
#
# Deploys a single-node Temporal server + Web UI backed by the chart's bundled
# Cassandra. This is a demo-scale durable-execution backend for the aep-api
# devflow workflows, NOT a production topology. aep-api runs the Temporal worker
# in-process and reaches the frontend via the start.sh host port bridge
# (host.docker.internal:7233).
#
# NOTE: the temporalio/temporal chart bundles ONLY Cassandra as a datastore —
# there is no `postgresql` subchart, so an external SQL store would have to be
# provisioned and pointed at separately. We use the bundled single-node
# Cassandra to keep the install a single `helm install` with no external DB.
#
# Consumed by deployments/scripts/setup-temporal.sh (chart temporal/temporal,
# pinned version there).

# Single-node Cassandra (the chart's default datastore). Elasticsearch,
# Prometheus and Grafana are all disabled to keep the labs footprint small.
cassandra:
  enabled: true
  config:
    cluster_size: 1

elasticsearch:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false

# Single-replica server; the chart wires persistence to the bundled Cassandra
# automatically, so no persistence override is needed here.
server:
  replicaCount: 1

schema:
  setup:
    enabled: true
  update:
    enabled: true

# Web UI (temporal-web service, port 8080 in-cluster) — start.sh port-forwards
# it to localhost:8233.
web:
  enabled: true
