# Temporal helm values — AEP local k3d labs profile.
#
# Deploys a single-replica Temporal server + Web UI backed by the chart's
# bundled PostgreSQL. Cassandra, Elasticsearch, Prometheus and Grafana are all
# disabled: this is a demo-scale durable-execution backend for the aep-api
# devflow workflows, NOT a production topology. aep-api runs the Temporal
# worker in-process and reaches the frontend via the start.sh host port bridge
# (host.docker.internal:7233).
#
# Consumed by deployments/scripts/setup-temporal.sh (chart temporal/temporal,
# pinned version there).

# Bundled PostgreSQL as the single persistence + visibility store; the default
# Cassandra dependency is turned off.
cassandra:
  enabled: false
elasticsearch:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false

postgresql:
  enabled: true

# Single-replica server; both the default and visibility stores point at the
# bundled postgres. The chart's schema setup job creates the databases on
# first install.
server:
  replicaCount: 1
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      default:
        driver: sql
        sql:
          driver: postgres12
          host: temporal-postgresql
          port: 5432
          database: temporal
          user: temporal
          password: temporal
          maxConns: 20
          maxIdleConns: 20
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: temporal-postgresql
          port: 5432
          database: temporal_visibility
          user: temporal
          password: temporal
          maxConns: 10
          maxIdleConns: 10

schema:
  setup:
    enabled: true
  update:
    enabled: true

# Web UI (temporal-web service, port 8080 in-cluster) — start.sh port-forwards
# it to localhost:8233.
web:
  enabled: true
