# Dev-mode patch for aep-coding-agent — adds a hostPath overlay of the host's
# repo-root skills/ library onto /app/skills inside the runner pod, so edits to
# a SKILL.md are picked up with no image rebuild and no registry push.
#
# NOTE a DISPATCHED run does not read /app/skills: its skills arrive as the
# `.claude/skills/` mirror the BFF writes into the project repo, so a skill edit
# reaches a build once `aep-api` has reconciled it into the org's skills repo
# (that image gets the same overlay). This mount is what the playground's local
# mode mirrors FROM (lib/local_skill_mirror.ts), and it keeps $AEP_SKILLS_DIR's
# fallback honest.
#
# Applied by setup-aep.sh via yq by default (opt out with AEP_PROD_RUNNER=1):
#   yq eval '
#     .spec.runTemplate.spec.templates[0].container.volumeMounts +=
#       load("...dev-patch.yaml").volumeMounts |
#     .spec.runTemplate.spec.volumes +=
#       load("...dev-patch.yaml").volumes
#   ' aep-coding-agent.yaml | kubectl apply -f -
#
# Requires the k3d cluster to have been created with the host skills bind
# mount onto the k3d server node at /aep-dev/skills (see setup-k3d.sh —
# also the default, also opt-out via AEP_PROD_RUNNER=1).
#
# Not a valid standalone manifest — intentionally fragmentary. The yq
# expression in setup-aep.sh splices these entries into the canonical
# manifest so we never drift from prod on every other field.

volumeMounts:
  - name: dev-skills
    mountPath: /app/skills
    readOnly: true

volumes:
  - name: dev-skills
    hostPath:
      path: /aep-dev/skills
      type: Directory
