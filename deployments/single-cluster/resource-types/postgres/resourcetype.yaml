apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: postgres
  annotations:
    openchoreo.dev/description: >-
      In-cluster PostgreSQL database backed by a single-replica StatefulSet.
      Ephemeral storage (emptyDir); for demonstration purposes only.
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        database:
          type: string
          default: appdb
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        memory:
          type: string
          default: 256Mi
        adminEnabled:
          type: boolean
          default: false
  outputs:
    - name: host
      value: "${metadata.name}.${metadata.namespace}.svc.cluster.local"
    - name: port
      value: "5432"
    - name: database
      configMapKeyRef:
        name: "${metadata.name}-config"
        key: database
    - name: username
      configMapKeyRef:
        name: "${metadata.name}-config"
        key: username
    - name: password
      secretKeyRef:
        name: "${metadata.name}-creds"
        key: password
    - name: url
      secretKeyRef:
        name: "${metadata.name}-creds"
        key: url
    - name: adminURL
      # gateway is not available in resource rendering context — use a simple flag
      value: "${environmentConfigs.adminEnabled ? \"enabled\" : \"disabled\"}"
    - name: adminPassword
      value: "${environmentConfigs.adminEnabled ? \"demo\" : \"disabled\"}"
  resources:
    - id: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: "${metadata.name}-config"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        data:
          database: "${parameters.database}"
          username: "${metadata.resourceName}-user"

    - id: init-scripts
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: "${metadata.name}-init"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        data:
          01-create-app-user.sh: |
            #!/bin/bash
            set -e
            psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
              CREATE USER "$APPUSER" WITH PASSWORD '$APPUSER_PASSWORD';
              GRANT ALL ON DATABASE "$POSTGRES_DB" TO "$APPUSER";
              GRANT ALL ON SCHEMA public TO "$APPUSER";
            EOSQL
          02-create-demo-user.sh: |
            #!/bin/bash
            set -e
            psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
              CREATE USER demo WITH SUPERUSER PASSWORD 'demo';
            EOSQL

    - id: password-gen-postgres
      template:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        metadata:
          name: "${metadata.name}-creds-postgres"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          length: 32
          digits: 8
          symbols: 0
          noUpper: false
          allowRepeat: true

    - id: creds-postgres
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: "${metadata.name}-creds-postgres"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          refreshInterval: "0"
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: "${metadata.name}-creds-postgres"
          target:
            name: "${metadata.name}-creds-postgres"
            creationPolicy: Owner

    - id: password-gen-app
      template:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        metadata:
          name: "${metadata.name}-creds"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          length: 32
          digits: 8
          symbols: 0
          noUpper: false
          allowRepeat: true

    - id: creds
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: "${metadata.name}-creds"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          refreshInterval: "0"
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  name: "${metadata.name}-creds"
          target:
            name: "${metadata.name}-creds"
            creationPolicy: Owner
            template:
              type: Opaque
              data:
                password: "{{ .password }}"
                url: "postgres://${metadata.resourceName}-user:{{ .password }}@${metadata.name}.${metadata.namespace}.svc.cluster.local:5432/${parameters.database}?sslmode=disable"

    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: "${metadata.name}"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          selector:
            app: "${metadata.name}"
          ports:
            - name: postgres
              port: 5432
              targetPort: 5432

    - id: statefulset
      readyWhen: "${applied.statefulset.status.readyReplicas == applied.statefulset.status.replicas && applied.statefulset.status.replicas > 0}"
      template:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: "${metadata.name}"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          replicas: 1
          serviceName: "${metadata.name}"
          selector:
            matchLabels:
              app: "${metadata.name}"
          template:
            metadata:
              labels:
                app: "${metadata.name}"
            spec:
              containers:
                - name: postgres
                  image: postgres:16-alpine
                  ports:
                    - name: postgres
                      containerPort: 5432
                  resources:
                    limits:
                      memory: "${environmentConfigs.memory}"
                  env:
                    - name: POSTGRES_USER
                      value: postgres
                    - name: POSTGRES_DB
                      valueFrom:
                        configMapKeyRef:
                          name: "${metadata.name}-config"
                          key: database
                    - name: POSTGRES_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: "${metadata.name}-creds-postgres"
                          key: password
                    - name: APPUSER
                      valueFrom:
                        configMapKeyRef:
                          name: "${metadata.name}-config"
                          key: username
                    - name: APPUSER_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: "${metadata.name}-creds"
                          key: password
                    - name: PGDATA
                      value: /var/lib/postgresql/data/pgdata
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/postgresql/data
                    - name: init-scripts
                      mountPath: /docker-entrypoint-initdb.d
              volumes:
                - name: data
                  emptyDir: {}
                - name: init-scripts
                  configMap:
                    name: "${metadata.name}-init"
                    defaultMode: 0755

    - id: admin-deployment
      # gateway is not in scope in resource rendering context — guard only on adminEnabled
      includeWhen: "${environmentConfigs.adminEnabled}"
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "${metadata.name}-admin"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: "${metadata.name}-admin"
          template:
            metadata:
              labels:
                app: "${metadata.name}-admin"
            spec:
              containers:
                - name: adminer
                  image: adminer:4.8.1-standalone
                  ports:
                    - name: http
                      containerPort: 8080
                  env:
                    - name: ADMINER_DEFAULT_SERVER
                      value: "${metadata.name}"

    - id: admin-service
      includeWhen: "${environmentConfigs.adminEnabled}"
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: "${metadata.name}-admin"
          namespace: "${metadata.namespace}"
          labels: "${metadata.labels}"
        spec:
          selector:
            app: "${metadata.name}-admin"
          ports:
            - name: http
              port: 8080
              targetPort: 8080

  retainPolicy: Delete
