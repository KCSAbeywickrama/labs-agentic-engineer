openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Per-user todo and list management, scoped by the authenticated caller.
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: service is healthy

  /lists:
    get:
      operationId: listLists
      summary: List the caller's lists
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: paginated lists
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/List' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createList
      summary: Create a new list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListInput' }
      responses:
        '201':
          description: list created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lists/{listId}:
    parameters:
      - name: listId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateList
      summary: Rename a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListInput' }
      responses:
        '200':
          description: list updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteList
      summary: Delete a list
      parameters:
        - name: reassignTo
          in: query
          description: listId (or "unlisted") to move this list's todos to before deleting
          schema: { type: string }
      responses:
        '204': { description: list deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /todos:
    get:
      operationId: listTodos
      summary: List the caller's todos
      parameters:
        - name: status
          in: query
          description: filter by completion status
          schema: { type: string, enum: [all, active, completed], default: all }
        - name: listId
          in: query
          description: filter by list
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: paginated todos
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTodo
      summary: Create a new todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoInput' }
      responses:
        '201':
          description: todo created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /todos/{todoId}:
    parameters:
      - name: todoId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTodo
      summary: Get a single todo
      responses:
        '200':
          description: the todo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTodo
      summary: Edit a todo's title, description, due date, or list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoInput' }
      responses:
        '200':
          description: todo updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      responses:
        '204': { description: todo deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /todos/{todoId}/complete:
    parameters:
      - name: todoId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: completeTodo
      summary: Mark a todo complete or incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: todo status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }

  responses:
    BadRequest:
      description: validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing or invalid caller identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: resource not found or not owned by caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

    List:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    ListInput:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Todo:
      type: object
      required: [id, title, done, createdAt, updatedAt]
      properties:
        id: { type: string }
        listId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        done: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TodoInput:
      type: object
      required: [title]
      properties:
        listId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
