apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: aep-api
endpoints:
  - name: http
    type: HTTP
    port: 8080
    visibility:
      - project
dependencies:
  endpoints:
    - component: aep-git-service
      name: http
      visibility: project
      envBindings:
        address: GIT_SERVICE_BASE_URL
