components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
  securitySchemes:
    userJWT:
      bearerFormat: JWT
      description: Thunder end-user JWT (RS256, JWKS-verified)
      scheme: bearer
      type: http
info:
  title: AEP Workflows API
  version: 1.0.0
openapi: 3.1.0
paths:
  /projects/{projectName}/design/generate:
    post:
      operationId: generate-design
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Generate the design (architect agent, SSE stream)
      tags:
        - Workflows
  /projects/{projectName}/tasks/plan:
    post:
      operationId: plan-tasks
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Plan implementation Tasks (SSE — raw StreamPart frames + [DONE])
      tags:
        - Workflows
  /projects/{projectName}/tasks/{issueNumber}/execute: # maybe execute all
    post:
      operationId: execute-task
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
        - description: GitHub issue number of the Task
          in: path
          name: issueNumber
          required: true
          schema:
            description: GitHub issue number of the Task
            format: int64
            type: integer
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Stamp aep:execute and dispatch through the funnel (async)
      tags:
        - Workflows
  /projects/{projectName}/tasks/{issueNumber}/hold: # no need if execute-all lands
    delete:
      operationId: unhold-task
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
        - description: GitHub issue number of the Task
          in: path
          name: issueNumber
          required: true
          schema:
            description: GitHub issue number of the Task
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Remove the aep:hold label and re-evaluate (idempotent)
      tags:
        - Workflows
    post:
      operationId: hold-task
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
        - description: GitHub issue number of the Task
          in: path
          name: issueNumber
          required: true
          schema:
            description: GitHub issue number of the Task
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Set the aep:hold label (level-triggered; idempotent)
      tags:
        - Workflows
