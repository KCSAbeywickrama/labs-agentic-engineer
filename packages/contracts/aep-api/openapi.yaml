# Placeholder contract for the aep-api BFF.
#
# Covers only what the console scaffold exercises (projects list). Replace
# with a real snapshot from the BFF when the contract work starts:
#   cd services/aep-api && go run ./cmd/openapigen
#   cp build/openapi.yaml ../../packages/contracts/aep-api/openapi.yaml
openapi: 3.1.0
info:
  title: AEP BFF API (placeholder)
  version: 0.0.0
paths:
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      responses:
        "200":
          description: The organization's projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
components:
  schemas:
    Project:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          type: string
    ProjectList:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Project"
    ErrorModel:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
