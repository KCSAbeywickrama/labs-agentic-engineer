        - Skills
    put:
      operationId: update-skill
      parameters:
        - description: Skill name (slug)
          in: path
          name: name
          required: true
          schema:
            description: Skill name (slug)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
