        - kind
        - description
        - skillMd
        - references
        - version
        - contentSha
        - updatedAt
      type: object
    TaskStatusResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/TaskStatusResponse.json
          format: uri
          readOnly: true
          type: string
        buildSteps:
          items:
            $ref: "#/components/schemas/WorkflowRunTask"
          type:
            - array
            - "null"
        task:
          $ref: "#/components/schemas/ComponentTask"
      required:
        - task
      type: object
    Tasks:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/Tasks.json
          format: uri
          readOnly: true
          type: string
        hasUnsavedChanges:
          type: boolean
        projectId:
          type: string
        sourceDesign:
          type: string
        status:
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/ComponentTask"
          type:
            - array
            - "null"
        version:
          format: int64
          type: integer
        versions:
          items:
            $ref: "#/components/schemas/ArtifactVersion"
          type:
            - array
            - "null"
      required:
        - projectId
        - tasks
        - status
        - version
        - hasUnsavedChanges
      type: object
    TurnInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/TurnInputBody.json
          format: uri
          readOnly: true
          type: string
        files:
          additionalProperties:
            type: string
          description: The FE's current draft (latest truth)
          type: object
        filesChangedExternally:
          description: User hand-edited since the last turn (chat)
          type: boolean
        instruction:
          description: User message / generation directive
          type: string
        target:
          description: Optional target (e.g. a doc type)
          type: string
        useCase:
          description: Which generation/chat flow
          enum:
            - requirements-generate
            - requirements-chat
            - design-generate
          type: string
      required:
        - useCase
        - instruction
      type: object
    UpdateConfigBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/UpdateConfigBody.json
          format: uri
          readOnly: true
          type: string
        envVars:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
      required:
        - envVars
      type: object
    UpdateProfileInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/UpdateProfileInputBody.json
          format: uri
          readOnly: true
          type: string
        issuer:
          description: OIDC issuer URL; empty leaves the existing value unchanged
          type: string
        jwksUrl:
          description: JWKS URL; empty leaves the existing value unchanged
          type: string
        kind:
          description: "IDP kind: platform | asgardeo | custom"
          type: string
      required:
        - kind
        - issuer
        - jwksUrl
      type: object
    UpdateSkillInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/UpdateSkillInput.json
          format: uri
          readOnly: true
          type: string
        references:
          additionalProperties:
            type: string
          type: object
        skillMd:
          type: string
      required:
        - skillMd
        - references
      type: object
    Warning:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - path
        - code
        - message
      type: object
    WorkflowRun:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/WorkflowRun.json
          format: uri
          readOnly: true
          type: string
        completed:
          type: boolean
        componentName:
          type: string
        name:
          type: string
        projectName:
          type: string
        startedAt:
          type: string
        status:
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/WorkflowRunTask"
          type:
            - array
            - "null"
      type: object
    WorkflowRunList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/WorkflowRunList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkflowRun"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    WorkflowRunTask:
      additionalProperties: false
      properties:
        completedAt:
          type: string
        message:
          type: string
        name:
          type: string
        phase:
          type: string
        startedAt:
          type: string
      required:
        - name
      type: object
    WriteOp:
      additionalProperties: false
      properties:
        baseSha:
          type: string
        content:
          type: string
        path:
          type: string
      required:
        - path
        - content
      type: object
  securitySchemes:
    userJWT:
      bearerFormat: JWT
      description: Thunder end-user JWT (RS256, JWKS-verified)
      scheme: bearer
      type: http
info:
  title: AEP BFF API
  version: 1.0.0
openapi: 3.1.0
paths:
  /collab/validate:
    get:
      operationId: validate-collab-access
      parameters:
        - description: Collaboration room ID (spec-<org>-<project>)
          in: header
          name: X-Room-Id
          schema:
            description: Collaboration room ID (spec-<org>-<project>)
            type: string
        - description: Bearer token; the display identity is decoded from it
          in: header
          name: Authorization
          schema:
            description: Bearer token; the display identity is decoded from it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollabValidateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Authorize a collaboration room (server-to-server)
      tags:
        - Collaboration
  /org/credentials/anthropic:
    delete:
      operationId: disconnect-anthropic
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Disconnect the org's Anthropic key
      tags:
        - Anthropic Integration
    get:
      operationId: get-anthropic-status
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get the org's Anthropic key status (projection, no key)
      tags:
        - Anthropic Integration
    post:
      operationId: connect-anthropic
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgAnthropicConnectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicProjection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Connect or replace the org's Anthropic API key
      tags:
        - Anthropic Integration
  /org/credentials/github:
    delete:
      operationId: disconnect-github
      parameters:
        - description: "App-mode only: when false, leave the install on GitHub for later re-adoption (defaults true)"
          explode: false
          in: query
          name: uninstall
          schema:
            default: true
            description: "App-mode only: when false, leave the install on GitHub for later re-adoption (defaults true)"
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Disconnect GitHub (cascade) for the org
      tags:
        - GitHub Integration
    get:
      operationId: get-github-status
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get GitHub connection status (projection, no token)
      tags:
        - GitHub Integration
  /org/credentials/github/connect/start:
    post:
      operationId: start-github-connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgGitHubStartConnectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Start App-mode GitHub connect (OAuth-driven)
      tags:
        - GitHub Integration
  /org/credentials/github/pat:
    post:
      operationId: connect-github-pat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgGitHubConnectPATInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Projection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Connect or replace a PAT-mode GitHub credential
      tags:
        - GitHub Integration
  /org/idp:
    get:
      operationId: get-idp-profile
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get the organization's IDP profile
      tags:
        - IDP
    put:
      operationId: update-idp-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Update the organization's IDP profile
      tags:
        - IDP
  /org/idp/discovery:
    get:
      operationId: discover-idp-issuer
      parameters:
        - description: OIDC issuer URL to fetch the discovery document for
          explode: false
          in: query
