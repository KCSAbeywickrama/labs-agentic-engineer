          schema:
            description: OIDC issuer URL to fetch the discovery document for
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Discover an OIDC issuer's metadata
      tags:
        - IDP
  /org/idp/rotate:
    post:
      operationId: regenerate-idp-client-secret
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecretOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Rotate the publisher client secret
      tags:
        - IDP
  /org/skills:
    get:
      operationId: list-skills
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: List skills
      tags:
        - Skills
    post:
      operationId: create-skill
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetailBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Create a custom skill
      tags:
        - Skills
  /org/skills/import:
    post:
      operationId: import-skill
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: Gzip-compressed AgentSkills tarball
                  format: binary
                  type: string
              required:
                - file
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Import an AgentSkills tarball
      tags:
        - Skills
  /org/skills/sync:
    post:
      operationId: sync-skills
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Sync built-in skills
      tags:
        - Skills
  /org/skills/updates:
    get:
      operationId: list-skill-updates
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: List available built-in skill updates
      tags:
        - Skills
  /org/skills/{name}:
    delete:
      operationId: delete-skill
      parameters:
        - description: Skill name (slug)
          in: path
          name: name
          required: true
          schema:
            description: Skill name (slug)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Delete a custom or imported skill
      tags:
        - Skills
    get:
      operationId: get-skill
      parameters:
        - description: Skill name (slug)
          in: path
          name: name
          required: true
          schema:
            description: Skill name (slug)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetailBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
