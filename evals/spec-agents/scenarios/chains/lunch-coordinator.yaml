# Chain scenario (#357): ONE brief, a rubric PER section. Requirements →
# design share one conversation; tasks runs detached off the produced design.

brief:
  name: lunch-coordinator
  idea: >-
    A web app for coordinating team lunch orders: someone opens a daily order,
    teammates add items from a chosen restaurant before a cutoff, and the
    opener gets one consolidated order to place.
  persona: >-
    Engineering manager at a 40-person startup; pragmatic, wants a small v1
    shipped fast; non-technical answers, plain language.
  facts:
    - Users sign in with their existing Google workspace accounts; no separate registration.
    - One order round per day is enough; the opener picks the restaurant and the cutoff time.
    - Teammates only add/edit/remove their own items before the cutoff; after cutoff the round locks.
    - The opener needs a consolidated view grouped by menu item, plus per-person cost totals.
    - Payment stays offline (people pay the opener back directly); the app only tracks who owes what.
    - "Notifications: a message to the team's existing Slack channel when a round opens and at cutoff is enough; no email."
    - Mobile browser support matters; a native app does not.
  fallback: >-
    Prefer the smallest reasonable v1; defer anything speculative; pick the
    recommended option when genuinely indifferent.

rubrics:
  requirements:
    mustCover:
      - item: Google-workspace sign-in captured; no separate registration flow invented
        weight: 2
      - item: "Daily order round lifecycle: open (restaurant + cutoff) -> teammates add own items -> lock at cutoff"
        weight: 2
      - Consolidated order view grouped by item with per-person cost totals
      - Payment explicitly out of scope beyond tracking who owes what
      - Slack notifications at round open and cutoff; no email flows invented
      - Mobile-browser support noted
    mustNot:
      - Native mobile app scope
      - In-app payment processing or money movement
  design:
    mustCover:
      - item: A web frontend component and a backend/API component are both designed
        weight: 2
      - Sign-in is single sign-on through the platform identity provider (the organization's settled default), with the team's existing company accounts; no local accounts, passwords or credential store
      - The API models the order-round lifecycle including the cutoff lock
      - Slack is an external dependency with its own definition, and the design notifies the team's channel when a round opens and at the cutoff
      - Consolidated/grouped order view with per-person totals is designed
      - item: "The web app's prototype (prototype.json + prototype.tsx) draws opening a round (restaurant, cutoff), a teammate adding, editing and removing their own items before the cutoff, the round locked after the cutoff, and the opener's consolidated order grouped by menu item with per-person totals"
        weight: 2
      - "specs/design/decisions.md holds only technical choices a product user would not notice (storage, paging, where a check runs), one line each, tagged with the artifact it shapes (architecture, data-model, security, flows) or a component's name, and naming the features it serves (or all); it restates no requirement line and lists no organization default (the stack, the sign-in provider) as a decision"
    mustNot:
      - A native mobile app component
      - Payment processing or money-movement integration
      - A requirements line the run added that widens the PRD's scope (a new feature, a new actor, or an integration the PRD does not have)
      - A wireframes.dsl file, or screens described anywhere but the prototype
  tasks:
    mustCover:
      - item: Every designed component has at least one implementable task
        weight: 2
      - Frontend tasks list their backend/API providers in build order (dependsOn)
      - A task covers the Slack notification integration
      - Tasks are right-sized (a coherent unit of work each, not one giant task or micro-fragments)
    mustNot:
      - Tasks for payment processing
      - Tasks for a native mobile app
