# The build plan: the one-shot task-plan turn from a captured per-feature
# design, with the scope the platform would send for a first build of every
# feature. Two components serve all three features, so the checklist is a
# Foundation item, then Claims, Approvals and Monthly report, each naming both.

name: expense-tracker
fixture: expense-tracker-design

scope:
  tag: v1
  # As aep-api's featureOrder computes it: F1.3's need on F2 would close a
  # loop with F2's file-level need on F1, so it does not order the features.
  features:
    - { id: F1, name: Claims }
    - { id: F2, name: Approvals, needs: [F1] }
    - { id: F3, name: Monthly report, needs: [F2] }
  productWide:
    - { id: P1, text: "Sign-in is SSO through the platform identity provider. What a person may do is decided by the permissions their roles grant, not by anything this app stores about them.", appliesTo: [all] }
    - { id: P2, text: "An Employee sees their own claims only; an Approver sees every claim. This is a permission difference, not two copies of the data.", appliesTo: [F1, F2] }

rubric:
  mustCover:
    - item: The checklist is Foundation, then Claims (F1), Approvals (F2), Monthly report (F3), each feature after the ones it needs
      weight: 2
    - Each feature item names the components that serve its stories — expense-api and expense-webapp
    - Foundation carries the shared setup of both components and the product-wide sign-in (P1)
    - Each note says something the specs do not say in one place (work across components, an order inside the item), in one or two sentences
  mustNot:
    - A note that restates design.json, openapi.yaml or the feature file
    - Items for a multi-step approval chain, draft claims, receipts or payment
