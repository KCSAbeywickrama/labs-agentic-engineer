openapi: 3.0.3
info:
  title: Lunch API
  version: "0.1.0"
  description: Rounds, items and the consolidated order for the team's daily lunch.
servers:
  - url: /
security:
  - oauth2: []
paths:
  /rounds:
    get:
      operationId: listRounds
      summary: Every round, open or past
      security:
        - oauth2: [rounds:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          description: Filter by open or closed
          schema: { type: string, enum: [open, closed] }
      responses:
        '200':
          description: A page of rounds, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching rounds }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Round' }
    post:
      operationId: openRound
      summary: Open a new round when none is open
      security:
        - oauth2: [rounds:open]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRound' }
      responses:
        '201':
          description: The round was opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Round' }
        '400':
          description: The cutoff is not in the future, or required fields are missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A round is already open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rounds/{roundId}:
    get:
      operationId: getRound
      summary: One round, with its items
      security:
        - oauth2: [rounds:read]
      parameters:
        - name: roundId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundDetail' }
        '404':
          description: No such round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rounds/{roundId}/close:
    post:
      operationId: closeRound
      summary: Close your own open round before its cutoff
      security:
        - oauth2: [rounds:close]
      parameters:
        - name: roundId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The round was closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Round' }
        '404':
          description: No such round, or it is not yours to close.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The round is already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rounds/{roundId}/items:
    get:
      operationId: listRoundItems
      summary: Every item added to a round
      security:
        - oauth2: [rounds:read]
      parameters:
        - name: roundId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The round's items.
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
        '404':
          description: No such round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: addItem
      summary: Add an item to the open round
      security:
        - oauth2: [items:add]
      parameters:
        - name: roundId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewItem' }
      responses:
        '201':
          description: The item was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          description: Quantity or price is not a positive number, or the round has passed its cutoff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /items/{itemId}:
    patch:
      operationId: updateItem
      summary: Edit an item you added
      security:
        - oauth2: [items:manage]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemEdit' }
      responses:
        '200':
          description: The item was updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          description: Quantity or price is not a positive number, or the round has passed its cutoff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such item, or it is not yours, or the round has closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeItem
      summary: Remove an item you added
      security:
        - oauth2: [items:manage]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: The item was removed.
        '404':
          description: No such item, or it is not yours, or the round has closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is up.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            rounds:read: Every round, open or past
            rounds:open: Open a new round
            rounds:close: Close your own open round early
            items:add: Add an item to the open round
            items:manage: Edit or remove an item you added
  schemas:
    Round:
      type: object
      required: [id, restaurant, cutoffAt, openedByName, status]
      properties:
        id: { type: string }
        restaurant: { type: string }
        notes: { type: string }
        cutoffAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        openedByName: { type: string, description: name of the teammate who opened the round }
        status: { type: string, enum: [open, closed], description: derived from cutoffAt and closedAt }
    NewRound:
      type: object
      required: [restaurant, cutoffAt]
      properties:
        restaurant: { type: string }
        cutoffAt: { type: string, format: date-time }
        notes: { type: string }
    RoundDetail:
      allOf:
        - $ref: '#/components/schemas/Round'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Item' }
    Item:
      type: object
      required: [id, roundId, description, quantity, priceCents, addedByName]
      properties:
        id: { type: string }
        roundId: { type: string }
        description: { type: string }
        quantity: { type: integer }
        priceCents: { type: integer, description: price in cents, as typed by the teammate who added it }
        addedByName: { type: string, description: name of the teammate who added the item }
    NewItem:
      type: object
      required: [description, quantity, priceCents]
      properties:
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
    ItemEdit:
      type: object
      properties:
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
