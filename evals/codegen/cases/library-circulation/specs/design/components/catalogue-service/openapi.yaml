openapi: 3.0.3
info:
  title: Catalogue Service
  version: 0.1.0
  description: Titles and copies. Called only by the circulation API.
servers:
  - url: /
paths:
  /titles:
    get:
      operationId: listTitles
      summary: Search titles
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches title, author or subject }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of titles with availability
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Title' } }
    post:
      operationId: createTitle
      summary: Add a title
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /titles/{titleId}:
    parameters:
      - { name: titleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTitle
      summary: A title with its available copy count
      responses:
        '200':
          description: The title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTitle
      summary: Edit a title
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTitle
      summary: Remove a title that has no copies on loan
      responses:
        '204':
          description: Removed
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /titles/{titleId}/copies:
    parameters:
      - { name: titleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listTitleCopies
      summary: Copies of a title
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of copies
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Copy' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createCopy
      summary: Add a copy to a title
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Copy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /copies:
    get:
      operationId: findCopies
      summary: Find copies by barcode
      parameters:
        - { name: barcode, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of copies
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Copy' } }
  /copies/{copyId}:
    parameters:
      - { name: copyId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCopy
      summary: A copy
      responses:
        '200':
          description: The copy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Copy' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCopy
      summary: Edit a copy's barcode or status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Copy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 }, description: Page size }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0 }, description: Items to skip }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    TitleInput:
      type: object
      required: [name, author]
      properties:
        name: { type: string }
        author: { type: string }
        subject: { type: string }
    Title:
      allOf:
        - $ref: '#/components/schemas/TitleInput'
        - type: object
          required: [id, copyCount, availableCopies]
          properties:
            id: { type: string }
            copyCount: { type: integer, description: Copies not withdrawn }
            availableCopies: { type: integer, description: Copies with status available }
    CopyInput:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string }
    CopyUpdate:
      type: object
      properties:
        barcode: { type: string }
        status: { type: string, enum: [available, on-loan, on-hold-shelf, withdrawn] }
    Copy:
      type: object
      required: [id, titleId, titleName, barcode, status]
      properties:
        id: { type: string }
        titleId: { type: string }
        titleName: { type: string }
        barcode: { type: string }
        status: { type: string, enum: [available, on-loan, on-hold-shelf, withdrawn] }
