# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Member, Librarian, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - Late fees cannot be created: the due date is fixed at 14 days from checkout and nothing lets a tester back-date a loan or the clock, so a late return, the computed fee (0.25 per day), the fee rows on My fees and the Fees desk, and the Late fee value on Check in cannot be walked. A person could add items for late check in once a loan is overdue.
#  - Marking a fee paid ('Mark paid' on the Fees desk) and the rule that unpaid fees block borrowing and checkout need an existing fee, so they are not walkable from an empty database.
#  - The 5-active-loans limit and the one-hold-per-title rule would need many titles or repeated holds; no item covers the 'Borrowing or checkout refused' state for those causes (the unavailable-copy checkout refusal is covered).
#  - The Member's own member id is not shown anywhere, so checkouts use arbitrary ids (m-9001 and so on) and a checkout cannot be tied to the signed-in Member's My loans. A person could add an item for a librarian checkout showing up on My loans if the id of test-member is known.
#  - The Member's hold position number is not specified by the spec, so no item expects a particular value.
#  - The 'Service failed' display state needs the backend to fail and is not walkable.
#  - The PRD says librarians edit and withdraw copies, and the prototype draws edit and withdraw only on the copy screen; the prototype was followed. The Librarian also has no screen listing all loans.
#  - Role reach: the Librarian's grants cover the Catalogue and Title detail screens, so no refusal item exists for them; one refused screen was chosen per role (Titles for Member, My loans for Librarian) and other refused screens are not separately tested.
#  - The prototype draws a 'Signed out' screen with a Sign in button, but wired mode shows the no-access state after sign out, so the item follows wired mode.

items:
  - id: librarian-lands-titles
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: Look at the screen the app opens on. Nothing has been created yet.
    expect: The Titles screen is shown with the heading 'Titles', an 'Add title' button, and the empty state 'No titles' with 'Add the first title.'.
    weight: 1
  - id: fees-desk-empty
    role: Librarian
    screen: Fees
    flow: Circulation desk
    steps: Open 'Fees' in the navigation.
    expect: The Fees screen loads and shows the empty state 'No fees' ('No member owes anything.'), with no crash.
    weight: 1
  - id: holds-queue-empty
    role: Librarian
    screen: Holds queue
    flow: Work holds
    steps: Open 'Holds queue' in the navigation.
    expect: The Holds queue screen loads and shows the empty state 'No holds' ('No member is waiting for a title.').
    weight: 1
  - id: add-title-validation
    role: Librarian
    screen: Add or edit a title
    flow: Manage catalogue
    steps: Open 'Titles' in the navigation, press 'Add title'. Leave Name and Author blank, fill Subject 'Fantasy', and press 'Save'.
    expect: The title is not saved; validation errors show that Name and Author are required and you stay on the Add title form.
    weight: 1
  - id: add-title-hobbit
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: On the Add title form fill Name 'The Hobbit', Author 'J.R.R. Tolkien', Subject 'Adventure', ISBN '9780261102217' and press 'Save'.
    expect: You arrive on the Titles screen and 'The Hobbit' by J.R.R. Tolkien is listed with 0 copies.
    weight: 2
  - id: add-title-dune
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: Press 'Add title'. Fill Name 'Dune', Author 'Frank Herbert', Subject 'Science fiction', ISBN '9780441172719' and press 'Save'.
    expect: You arrive on the Titles screen and 'Dune' by Frank Herbert is listed.
    weight: 1
  - id: add-title-emma
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: Press 'Add title'. Fill Name 'Emma', Author 'Jane Austen', Subject 'Romance', ISBN '9780141439587' and press 'Save'.
    expect: You arrive on the Titles screen and 'Emma' by Jane Austen is listed.
    weight: 1
  - id: add-title-temp
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: Press 'Add title'. Fill Name 'Temp Title', Author 'Test Author' and press 'Save'.
    expect: You arrive on the Titles screen and 'Temp Title' is listed.
    weight: 1
  - id: remove-title-temp
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: In the Titles table press 'Edit' on the 'Temp Title' row, then press 'Remove title'.
    expect: You arrive on the Titles screen and 'Temp Title' is no longer listed; the other titles remain.
    weight: 2
  - id: edit-title-hobbit
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: Press 'Edit' on the 'The Hobbit' row. Change Subject to 'Fantasy' and press 'Save'. Then press 'Edit' on the same row again.
    expect: You arrive on the Titles screen with 'The Hobbit' still listed; reopening the edit form shows Subject 'Fantasy'.
    weight: 2
  - id: titles-search
    role: Librarian
    screen: Titles
    flow: Manage catalogue
    steps: On the Titles screen type 'Dune' in 'Search titles'. Then clear the field.
    expect: With 'Dune' typed the table shows the Dune row; after clearing, The Hobbit, Dune and Emma are all listed again.
    weight: 1
  - id: copies-empty
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: On the Titles screen press the 'The Hobbit' row.
    expect: The screen 'Copies of The Hobbit' opens with an 'Add copy' button and the empty state 'No copies' ('Add a copy to make this title borrowable.').
    weight: 1
  - id: add-copy-validation
    role: Librarian
    screen: Add or edit a copy
    flow: Manage catalogue
    steps: On Copies of The Hobbit press 'Add copy'. Leave Barcode blank and press 'Save'.
    expect: The copy is not saved; a validation error says Barcode is required and you stay on the Add copy form.
    weight: 1
  - id: add-copy-hob-001
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: Fill Barcode 'HOB-001' and press 'Save'.
    expect: You arrive on 'Copies of The Hobbit' and a copy with barcode HOB-001 is listed with status available.
    weight: 2
  - id: add-copy-hob-099
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: Press 'Add copy', fill Barcode 'HOB-099' and press 'Save'.
    expect: HOB-099 is listed on Copies of The Hobbit next to HOB-001.
    weight: 1
  - id: edit-copy-barcode
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: Press the HOB-099 row. Change Barcode to 'HOB-002' and press 'Save'.
    expect: You arrive on Copies of The Hobbit; the list shows HOB-001 and HOB-002 and no HOB-099.
    weight: 2
  - id: withdraw-copy
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: Press the HOB-002 row and press 'Withdraw copy'.
    expect: You arrive on Copies of The Hobbit and HOB-002 shows a withdrawn status; HOB-001 is still available.
    weight: 2
  - id: add-copy-dune
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: Open 'Titles', press the 'Dune' row, press 'Add copy', fill Barcode 'DUN-001' and press 'Save'.
    expect: You arrive on 'Copies of Dune' and DUN-001 is listed as available.
    weight: 1
  - id: add-copy-emma
    role: Librarian
    screen: Copies of a title
    flow: Manage catalogue
    steps: Open 'Titles', press the 'Emma' row, press 'Add copy', fill Barcode 'EMM-001' and press 'Save'.
    expect: You arrive on 'Copies of Emma' and EMM-001 is listed as available.
    weight: 1
  - id: checkout-validation
    role: Librarian
    screen: Check out
    flow: Circulation desk
    steps: Open 'Check out' in the navigation. Clear Member id and Copy barcode so both are blank and press 'Check out'.
    expect: Nothing is checked out; validation errors say Member id is required and Copy barcode is required.
    weight: 1
  - id: checkout-hobbit
    role: Librarian
    screen: Check out
    flow: Circulation desk
    steps: Fill Member id 'm-9003', Copy barcode 'HOB-001' and press 'Check out'.
    expect: A success message 'Checked out' appears saying HOB-001 is out to m-9003 with a due date 14 days from today.
    weight: 2
  - id: checkin-validation
    role: Librarian
    screen: Check in
    flow: Circulation desk
    steps: Open 'Check in' in the navigation. Leave Copy barcode blank and press 'Check in'.
    expect: Nothing is checked in; a validation error says Copy barcode is required.
    weight: 1
  - id: checkin-on-time
    role: Librarian
    screen: Check in
    flow: Circulation desk
    steps: Fill Copy barcode 'HOB-001' and press 'Check in'.
    expect: A success message 'Checked in' says The Hobbit was returned on time, and the Late fee shows 0.00.
    weight: 2
  - id: checkout-dune
    role: Librarian
    screen: Check out
    flow: Circulation desk
    steps: Open 'Check out'. Fill Member id 'm-9001', Copy barcode 'DUN-001' and press 'Check out'.
    expect: A success message says DUN-001 is out to m-9001 with a due date 14 days from today.
    weight: 1
  - id: checkout-emma
    role: Librarian
    screen: Check out
    flow: Circulation desk
    steps: Fill Member id 'm-9002', Copy barcode 'EMM-001' and press 'Check out'.
    expect: A success message says EMM-001 is out to m-9002 with a due date 14 days from today.
    weight: 1
  - id: checkout-refused-unavailable
    role: Librarian
    screen: Check out
    flow: Circulation desk
    steps: Fill Member id 'm-9004', Copy barcode 'DUN-001' (already out to m-9001) and press 'Check out'.
    expect: The checkout is refused with an error that the copy is not available (or the member cannot borrow); no success message appears.
    weight: 1
  - id: checkin-refused-no-loan
    role: Librarian
    screen: Check in
    flow: Circulation desk
    steps: Open 'Check in'. Fill Copy barcode 'HOB-001' (returned earlier, no active loan) and press 'Check in'.
    expect: The check in is refused with an error that no active loan exists for that copy; no success message appears.
    weight: 1
  - id: remove-title-refused
    role: Librarian
    screen: Add or edit a title
    flow: Manage catalogue
    steps: Open 'Titles', press 'Edit' on the 'Dune' row (its copy is on loan), and press 'Remove title'.
    expect: Removal is refused with an error that the title cannot be removed because a copy is on loan; Dune stays in the Titles list.
    weight: 1
  - id: member-lands-catalogue
    role: Member
    screen: Catalogue
    flow: Find and borrow
    steps: Look at the screen the app opens on.
    expect: The Catalogue screen shows a Search field and lists The Hobbit (1 available), Dune (0 available) and Emma (0 available).
    weight: 1
  - id: my-loans-empty
    role: Member
    screen: My loans
    flow: Find and borrow
    steps: Open 'My loans' in the navigation.
    expect: The My loans screen shows 0 active loans and the empty state 'No active loans' with a 'Browse catalogue' button.
    weight: 1
  - id: my-holds-empty
    role: Member
    screen: My holds
    flow: Holds and fees
    steps: Open 'My holds' in the navigation.
    expect: The My holds screen shows the empty state 'No holds'.
    weight: 1
  - id: my-fees-empty
    role: Member
    screen: My fees
    flow: Holds and fees
    steps: Open 'My fees' in the navigation.
    expect: The My fees screen shows the Unpaid total 0.00 and the empty state 'No fees' ('You owe nothing.').
    weight: 1
  - id: catalogue-search-title
    role: Member
    screen: Catalogue
    flow: Find and borrow
    steps: Open 'Catalogue'. Type 'Dune' in Search.
    expect: The table shows the Dune row (author Frank Herbert).
    weight: 1
  - id: catalogue-search-author
    role: Member
    screen: Catalogue
    flow: Find and borrow
    steps: Replace the search text with 'Austen'.
    expect: The table shows the Emma row (author Jane Austen).
    weight: 1
  - id: catalogue-search-subject
    role: Member
    screen: Catalogue
    flow: Find and borrow
    steps: Replace the search text with 'Fantasy'.
    expect: The table shows the The Hobbit row.
    weight: 1
  - id: catalogue-search-none
    role: Member
    screen: Catalogue
    flow: Find and borrow
    steps: Replace the search text with 'zzzz-nothing'.
    expect: The table shows the empty state 'No titles found' ('Try another title, author or subject.').
    weight: 1
  - id: title-detail-available
    role: Member
    screen: Title detail
    flow: Find and borrow
    steps: Clear the search and press the 'The Hobbit' row.
    expect: The Title detail screen shows Author J.R.R. Tolkien, Subject Fantasy, ISBN 9780261102217 and '1 copies available'; the 'Borrow' button is usable.
    weight: 1
  - id: title-detail-unavailable
    role: Member
    screen: Title detail
    flow: Find and borrow
    steps: Press the 'Catalogue' breadcrumb, then press the 'Dune' row.
    expect: The Title detail screen shows '0 copies available'; 'Place hold' is usable and 'Borrow' is not.
    weight: 1
  - id: borrow-hobbit
    role: Member
    screen: My loans
    flow: Find and borrow
    steps: Press the 'Catalogue' breadcrumb, open 'The Hobbit' and press 'Borrow'.
    expect: You arrive on My loans, which lists The Hobbit with a checked-out date of today, a due date 14 days later, and Active loans 1.
    weight: 2
  - id: place-hold-dune
    role: Member
    screen: My holds
    flow: Holds and fees
    steps: Open 'Catalogue', open 'Dune' and press 'Place hold'.
    expect: You arrive on My holds, which lists a hold for Dune with a waiting status.
    weight: 2
  - id: place-hold-emma
    role: Member
    screen: My holds
    flow: Holds and fees
    steps: Open 'Catalogue', open 'Emma' (0 available) and press 'Place hold'.
    expect: My holds lists holds for both Dune and Emma.
    weight: 1
  - id: holds-queue-lists
    role: Librarian
    screen: Holds queue
    flow: Work holds
    steps: Open 'Holds queue' in the navigation.
    expect: The queue lists one hold for Dune and one for Emma (the member's holds from place-hold-dune and place-hold-emma), each with a member, a placed date and a waiting status.
    weight: 2
  - id: holds-queue-filter
    role: Librarian
    screen: Holds queue
    flow: Work holds
    steps: Type 'Emma' in 'Filter by title'. Then clear it.
    expect: With 'Emma' typed the table shows the Emma hold; after clearing, both Dune and Emma holds are listed.
    weight: 1
  - id: checkin-dune-hold-ready
    role: Librarian
    screen: Holds queue
    flow: Circulation desk
    steps: Open 'Check in', fill Copy barcode 'DUN-001' and press 'Check in'. Then open 'Holds queue'.
    expect: Check in succeeds with 'Checked in'. In the Holds queue the Dune hold is now ready for the member rather than waiting.
    weight: 2
  - id: librarian-cancel-hold
    role: Librarian
    screen: Holds queue
    flow: Work holds
    steps: On the Holds queue press 'Cancel hold' on the Emma row.
    expect: The Emma hold disappears from the queue; the Dune hold remains.
    weight: 2
  - id: member-sees-hold-ready
    role: Member
    screen: My holds
    flow: Holds and fees
    steps: Open 'My holds'.
    expect: The Dune hold shows a ready status; the Emma hold is no longer listed.
    weight: 1
  - id: member-cancel-hold
    role: Member
    screen: My holds
    flow: Holds and fees
    steps: On My holds press 'Cancel hold' on the Dune row.
    expect: The Dune hold disappears and the empty state 'No holds' shows.
    weight: 2
  - id: member-account
    role: Member
    screen: Account
    flow: Account
    steps: Open the user menu in the app shell and choose the account entry.
    expect: The Account screen shows Name, Email and Role, with Role Member.
    weight: 1
  - id: member-settings
    role: Member
    screen: Catalogue
    flow: Settings
    steps: Open the user menu, choose settings, switch 'Compact tables' on and press 'Save settings'.
    expect: The Settings screen loads with the 'Compact tables' switch; after saving you arrive on the Catalogue.
    weight: 1
  - id: member-refused-titles
    role: Member
    screen: Titles
    flow: Role reach
    steps: Open the address the Titles screen had in librarian-lands-titles.
    expect: "The Member is refused that screen: the Titles management list and its data are not shown."
    weight: 1
  - id: librarian-refused-my-loans
    role: Librarian
    screen: My loans
    flow: Role reach
    steps: Open the address My loans had in my-loans-empty.
    expect: "The Librarian is refused that screen: the member loans list is not shown."
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: No access
    flow: Role reach
    steps: Look at what the app shows.
    expect: A no-access page is shown instead of the app; no library screen or data appears.
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: Catalogue
    flow: Role reach
    steps: Load the app while signed out.
    expect: The app's sign-in guard runs, the address loses the signed-out marker and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: librarian-sign-out
    role: Librarian
    screen: No access
    flow: Sign out
    steps: Open the user menu and choose sign out.
    expect: The Librarian's screens and data are gone and the no-access state shows; no sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
