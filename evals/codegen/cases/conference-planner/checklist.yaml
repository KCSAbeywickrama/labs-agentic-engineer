# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Organizer, Speaker, Reviewer, Attendee, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - Waitlisting and automatic promotion need two attendees competing for one full session; only one Attendee identity is available and capacity cannot be set to zero, so the Join waitlist action, waitlist positions, promotion on cancellation and the organizer's waitlist rows are not walkable. A person with a second attendee could add: attendee B joins the waitlist of a full session, attendee A cancels, B becomes Confirmed.
#  - Reviewer refusal: Reviewer lacks only proposals:read, registrations:read and registrations:read-all; refusal item written for My proposals only; reach to Organizer screens that need events:manage is not blocked by the spec (events, rooms, sessions list operations need no scope), so no refusal items are written for Manage events, Event form, Event rooms and sessions or Add room for any role.
#  - Attendee refusal is written only for Session registrations; Speaker only for Review queue; Organizer only for My registrations; other role/screen refusals follow the same grant rule and were not itemised.
#  - Proposal and registration screens in the prototype are drawn for a fixed speaker (Amara Perera) and fixed attendee, so per-user isolation of proposals and registrations cannot be walked with one identity per role.
#  - Display states not walkable: Request failed on list screens, Registration in progress (delayed), and 'Decision refused' on an already-decided proposal (the Accept button is disabled after rejection and a decided proposal cannot be re-decided through the UI).
#  - PRD says an organizer can assign reviewers to proposals and edit sessions; the prototype draws no assign-reviewer control and no session edit, so neither is checked. The prototype lets the Session form save without a Room-required check beyond the draw; its end-time field is not displayed in session lists.
#  - Speaker submit, Browse events empty state and Event detail empty-sessions state only walk once each: after data exists the empty states for events and sessions on the Attendee side cannot be revisited.
#  - No-access page and signed-out screen names are not in the manifest; the 'screen' value 'No access' is a label for the no-access state the app shows.

items:
  - id: attendee-lands-home
    role: Attendee
    screen: Home
    flow: Attendee entry
    steps: Look at the screen the app opens on after sign-in.
    expect: The Home screen shows a welcome heading and a start section for the Attendee role with options to browse events and open My registrations.
    weight: 1
  - id: attendee-events-empty
    role: Attendee
    screen: Browse events
    flow: Browse and register
    steps: From Home press 'Browse events'.
    expect: The Browse events screen loads with no crash and an empty state ('No events yet') instead of rows, since nothing has been created.
    weight: 1
  - id: attendee-registrations-empty
    role: Attendee
    screen: My registrations
    flow: Browse and register
    steps: From the navigation open 'My registrations'.
    expect: The My registrations screen shows the empty state 'No registrations' with a way to browse events.
    weight: 1
  - id: speaker-lands-home
    role: Speaker
    screen: Home
    flow: Speaker entry
    steps: Look at the screen the app opens on after sign-in.
    expect: "The Home screen shows a welcome heading and start options for the Speaker role: My proposals and Submit a proposal."
    weight: 1
  - id: speaker-proposals-empty
    role: Speaker
    screen: My proposals
    flow: Submit a talk
    steps: From Home press 'My proposals'.
    expect: The My proposals screen shows the empty state 'No proposals yet' with a way to submit a proposal.
    weight: 1
  - id: reviewer-lands-home
    role: Reviewer
    screen: Home
    flow: Reviewer entry
    steps: Look at the screen the app opens on after sign-in.
    expect: The Home screen shows a welcome heading and an option to open the review queue.
    weight: 1
  - id: reviewer-queue-empty
    role: Reviewer
    screen: Review queue
    flow: Score proposals
    steps: From Home press 'Open review queue'.
    expect: The Review queue loads with the empty state 'Nothing to review' and no rows.
    weight: 1
  - id: organizer-lands-home
    role: Organizer
    screen: Home
    flow: Organizer entry
    steps: Look at the screen the app opens on after sign-in.
    expect: "The Home screen shows a welcome heading and start options for the Organizer role: Manage events and Review proposals."
    weight: 1
  - id: organizer-manage-events-empty
    role: Organizer
    screen: Manage events
    flow: Build the program
    steps: From Home press 'Manage events'.
    expect: The Manage events screen shows the empty state 'No events' with a 'New event' action.
    weight: 1
  - id: organizer-proposals-empty
    role: Organizer
    screen: Proposals
    flow: Decide proposals
    steps: From the navigation open 'Proposals'.
    expect: The Proposals screen shows the empty state 'No proposals' and no rows.
    weight: 1
  - id: organizer-event-validation
    role: Organizer
    screen: Event form
    flow: Build the program
    steps: Open Manage events, press 'New event', leave Name, Start date and End date blank and press Save.
    expect: The event is not created, the form stays open and shows validation errors for the missing required fields (Validation errors state).
    weight: 1
  - id: organizer-create-event
    role: Organizer
    screen: Manage events
    flow: Create and edit events
    steps: On the Event form (press 'New event' from Manage events if needed) enter Name 'DevSummit 2026', Venue 'Colombo', Start date 2026-11-12, End date 2026-11-14 and press Save.
    expect: You arrive on Manage events and a row 'DevSummit 2026' with venue Colombo and dates 2026-11-12 to 2026-11-14 is listed.
    weight: 2
  - id: organizer-create-second-event
    role: Organizer
    screen: Manage events
    flow: Create and edit events
    steps: Press 'New event', enter Name 'CloudDays', Venue 'Kandy', Start date 2026-12-03, End date 2026-12-04 and press Save.
    expect: Manage events lists both 'DevSummit 2026' and 'CloudDays'.
    weight: 1
  - id: organizer-edit-event
    role: Organizer
    screen: Manage events
    flow: Create and edit events
    steps: Open the 'CloudDays' row, press 'Edit event', change Venue to 'Galle' and press Save.
    expect: The form was titled 'Edit event' and showed the existing values; after Save you are on Manage events and the CloudDays row shows venue Galle.
    weight: 2
  - id: organizer-admin-empty
    role: Organizer
    screen: Event rooms and sessions
    flow: Build the program
    steps: On Manage events open the 'DevSummit 2026' row.
    expect: The Event rooms and sessions screen for DevSummit 2026 shows the empty states 'No rooms' and 'No sessions', with Add room, Add session and Edit event actions.
    weight: 1
  - id: organizer-room-validation
    role: Organizer
    screen: Add room
    flow: Build the program
    steps: Press 'Add room', leave Room name and Capacity blank and press Save.
    expect: No room is created, the form stays open and shows validation errors (Validation errors state).
    weight: 1
  - id: organizer-add-room
    role: Organizer
    screen: Event rooms and sessions
    flow: Define rooms
    steps: On the Add room form enter Room name 'Hall A', Capacity 120 and press Save.
    expect: You return to the DevSummit 2026 admin screen and the Rooms list shows 'Hall A' with capacity 120.
    weight: 2
  - id: organizer-session-validation
    role: Organizer
    screen: Session form
    flow: Build the program
    steps: Press 'Add session', leave Title, Start time, End time and Capacity blank and press Save.
    expect: No session is created, the form stays open and shows validation errors (Validation errors state).
    weight: 1
  - id: organizer-add-session
    role: Organizer
    screen: Event rooms and sessions
    flow: Create sessions
    steps: On the Session form enter Title 'Intro to APIs', Room 'Hall A', Start time '2026-11-12 10:00', End time '2026-11-12 11:00', Capacity 1 and press Save.
    expect: You return to the DevSummit 2026 admin screen and the Sessions list shows 'Intro to APIs' in Hall A at 2026-11-12 10:00 with capacity 1 and waitlist 0.
    weight: 2
  - id: organizer-room-conflict
    role: Organizer
    screen: Session form
    flow: Create sessions
    steps: Press 'Add session' again and enter Title 'Clash Test', Room 'Hall A', Start time '2026-11-12 10:30', End time '2026-11-12 11:30', Capacity 5 and press Save.
    expect: The session is not created because Hall A is already booked in that slot; the form shows that another session uses this room in that time slot (Request failed state), and no 'Clash Test' row appears in the Sessions list.
    weight: 1
  - id: organizer-session-regs-empty
    role: Organizer
    screen: Session registrations
    flow: Build the program
    steps: Cancel out to the DevSummit 2026 admin screen and open the 'Intro to APIs' row.
    expect: The Session registrations screen shows Seats left 1 of 1, Waitlist 0 and the empty state 'No registrations'.
    weight: 1
  - id: attendee-session-before-event
    role: Attendee
    screen: Event and sessions
    flow: Browse and register
    steps: Open 'Browse events', open the 'DevSummit 2026' row, and on the 'Intro to APIs' row press 'Register for session' without registering for the event first.
    expect: "The event page lists the Intro to APIs session with Seats left 1. The session registration is not made: Seats left stays 1 and 'Your registration' still reads 'Not registered'."
    weight: 1
  - id: attendee-register-event
    role: Attendee
    screen: Event and sessions
    flow: Register for an event
    steps: On the DevSummit 2026 page press 'Register for event'.
    expect: "'Your registration' reads Confirmed and the register button is replaced by a disabled 'Registered'."
    weight: 2
  - id: attendee-register-session
    role: Attendee
    screen: Event and sessions
    flow: Register for a session
    steps: On the DevSummit 2026 page press 'Register for session' on the 'Intro to APIs' row.
    expect: "The registration is confirmed: Seats left for Intro to APIs drops from 1 to 0."
    weight: 2
  - id: attendee-my-registrations
    role: Attendee
    screen: My registrations
    flow: Browse and register
    steps: Open 'My registrations' from the navigation.
    expect: "Two rows: 'DevSummit 2026' and 'Intro to APIs', each with status Confirmed and no waitlist position."
    weight: 1
  - id: organizer-session-regs-shows-attendee
    role: Organizer
    screen: Session registrations
    flow: See registrations per session
    steps: Open Manage events, 'DevSummit 2026', then the 'Intro to APIs' row.
    expect: Seats left 0 of 1, Waitlist 0, and the Attendees list holds one row with status Confirmed.
    weight: 2
  - id: attendee-cancel-session
    role: Attendee
    screen: My registrations
    flow: Cancel registration
    steps: On My registrations press 'Cancel' on the 'Intro to APIs' row.
    expect: The row's status becomes Cancelled and it no longer offers Cancel. The 'DevSummit 2026' row stays Confirmed. On the DevSummit 2026 event page Intro to APIs shows Seats left 1.
    weight: 2
  - id: organizer-seat-freed
    role: Organizer
    screen: Session registrations
    flow: See registrations per session
    steps: Open Manage events, 'DevSummit 2026', then the 'Intro to APIs' row.
    expect: Seats left shows 1 of 1 and Waitlist 0 after the attendee's cancellation.
    weight: 1
  - id: speaker-submit-validation
    role: Speaker
    screen: Submit a proposal
    flow: Submit a talk
    steps: From My proposals press 'New proposal', leave Talk title and Abstract blank and press Submit.
    expect: No proposal is created, the form stays open and shows validation errors for title and abstract (Validation errors state).
    weight: 1
  - id: speaker-submit-proposal
    role: Speaker
    screen: My proposals
    flow: Submit a talk
    steps: On Submit a proposal choose Event 'DevSummit 2026', Talk title 'Resilient Event Pipelines', Abstract 'Retries, idempotency and dead letters for event-driven systems.' and press Submit.
    expect: You arrive on My proposals and a row 'Resilient Event Pipelines' for DevSummit 2026 is listed with status Submitted.
    weight: 2
  - id: speaker-submit-second
    role: Speaker
    screen: My proposals
    flow: Submit a talk
    steps: Press 'New proposal', choose Event 'CloudDays', Talk title 'Edge Functions', Abstract 'Running code close to users.' and press Submit.
    expect: My proposals lists both proposals, each with status Submitted, 'Edge Functions' for CloudDays.
    weight: 1
  - id: reviewer-queue-lists
    role: Reviewer
    screen: Review queue
    flow: Score proposals
    steps: From Home press 'Open review queue' (the event filter starts at 'All events').
    expect: Both proposals are listed with their speaker, an average score showing no score yet, and 0 reviews.
    weight: 1
  - id: reviewer-queue-filter
    role: Reviewer
    screen: Review queue
    flow: Score proposals
    steps: Set the Event filter to 'DevSummit 2026'.
    expect: Only 'Resilient Event Pipelines' is listed; 'Edge Functions' is not.
    weight: 1
  - id: reviewer-open-proposal
    role: Reviewer
    screen: Score a proposal
    flow: Score proposals
    steps: With the filter on 'DevSummit 2026', open the 'Resilient Event Pipelines' row.
    expect: The Score a proposal screen shows the speaker, the abstract, average score (none yet), 0 reviews and a Score 1 to 5 field.
    weight: 1
  - id: reviewer-score-proposal
    role: Reviewer
    screen: Review queue
    flow: Score proposals
    steps: On the proposal choose Score 4 and press 'Submit score'.
    expect: You arrive back on the Review queue and the proposal now shows average score 4 (4.0) with 1 review.
    weight: 2
  - id: reviewer-score-twice
    role: Reviewer
    screen: Score a proposal
    flow: Score proposals
    steps: Open 'Resilient Event Pipelines' again, choose Score 2 and press 'Submit score'.
    expect: The second score is refused because each reviewer scores a proposal once; the average stays 4 and reviews stay 1 (Request failed state).
    weight: 1
  - id: organizer-proposals-list
    role: Organizer
    screen: Proposals
    flow: Decide proposals
    steps: From Home press 'Review proposals' (filter at 'All events').
    expect: Both proposals are listed with speaker and status Submitted; 'Resilient Event Pipelines' shows average score 4.
    weight: 1
  - id: organizer-proposals-filter
    role: Organizer
    screen: Proposals
    flow: Decide proposals
    steps: Set the Event filter to 'CloudDays'.
    expect: Only 'Edge Functions' is listed.
    weight: 1
  - id: organizer-open-decision
    role: Organizer
    screen: Decide a proposal
    flow: Decide proposals
    steps: With the filter on 'CloudDays', open the 'Edge Functions' row.
    expect: The Decide a proposal screen shows the speaker, status Submitted, the abstract, and Reject and 'Accept and schedule' buttons.
    weight: 1
  - id: organizer-reject-proposal
    role: Organizer
    screen: Proposals
    flow: Decide proposals
    steps: On the Edge Functions decision screen press 'Reject'.
    expect: You arrive back on the Proposals list and 'Edge Functions' shows status Rejected.
    weight: 2
  - id: organizer-accept-schedule
    role: Organizer
    screen: Event rooms and sessions
    flow: Decide proposals
    steps: On Proposals set the filter to 'DevSummit 2026', open 'Resilient Event Pipelines', press 'Accept and schedule'. On the Session form (title prefilled with the proposal title) choose Room 'Hall A', Start time '2026-11-13 09:00', End time '2026-11-13 10:00', Capacity 50 and press Save.
    expect: The Session form opens for scheduling the proposal; after Save you arrive on the DevSummit 2026 admin screen where 'Resilient Event Pipelines' is listed as a session in Hall A with capacity 50.
    weight: 2
  - id: speaker-sees-outcomes
    role: Speaker
    screen: My proposals
    flow: Track proposal outcome
    steps: From Home open 'My proposals'.
    expect: "'Resilient Event Pipelines' shows status Accepted and 'Edge Functions' shows status Rejected."
    weight: 2
  - id: attendee-sees-new-session
    role: Attendee
    screen: Event and sessions
    flow: Browse sessions
    steps: Open 'Browse events' and open the 'DevSummit 2026' row.
    expect: The Sessions list shows both 'Intro to APIs' and 'Resilient Event Pipelines' with room, time, seats left (50 for the new one) and waitlist columns.
    weight: 2
  - id: attendee-account
    role: Attendee
    screen: Account
    flow: Account
    steps: Open the user menu in the top bar and choose the account entry.
    expect: The Account screen shows Name, Email and Role (Attendee).
    weight: 1
  - id: organizer-settings
    role: Organizer
    screen: Home
    flow: Settings
    steps: Open the user menu and choose settings; on the Settings screen switch 'Compact tables' on and press 'Save settings'.
    expect: The Settings screen shows a 'Compact tables' switch; after saving you arrive on Home with no crash.
    weight: 1
  - id: organizer-account
    role: Organizer
    screen: Account
    flow: Account
    steps: Open the user menu and choose the account entry.
    expect: The Account screen shows Name, Email and Role (Organizer).
    weight: 1
  - id: attendee-refused-session-registrations
    role: Attendee
    screen: Session registrations
    flow: Role access
    steps: Open the address the Session registrations screen had in organizer-session-regs-shows-attendee.
    expect: "The Attendee is refused: the session's attendee list is not shown, and the app does not crash."
    weight: 1
  - id: speaker-refused-review-queue
    role: Speaker
    screen: Review queue
    flow: Role access
    steps: Open the address the Review queue had in reviewer-queue-lists.
    expect: "The Speaker is refused: the proposals of other speakers are not shown, and the app does not crash."
    weight: 1
  - id: reviewer-refused-my-proposals
    role: Reviewer
    screen: My proposals
    flow: Role access
    steps: Open the address My proposals had in speaker-sees-outcomes.
    expect: "The Reviewer is refused: the speaker's proposals are not shown, and the app does not crash."
    weight: 1
  - id: organizer-refused-my-registrations
    role: Organizer
    screen: My registrations
    flow: Role access
    steps: Open the address My registrations had in attendee-my-registrations.
    expect: "The Organizer is refused: the attendee's registrations are not shown, and the app does not crash."
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: No access
    flow: Role access
    steps: Look at the screen the app shows after sign-in.
    expect: A no-access page is shown instead of the app; no events, proposals or registrations are visible.
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: Home
    flow: Sign-in guard
    steps: Load the app signed out and wait.
    expect: The address loses 'auth=out' and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: sign-out
    role: Attendee
    screen: No access
    flow: Sign out
    steps: Open the user menu and choose sign out.
    expect: The Attendee's screens and data are gone and the no-access state shows; no sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
