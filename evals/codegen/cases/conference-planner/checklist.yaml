# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Organizer, Speaker, Reviewer, Attendee, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - The manifest entryScreen is Events for everyone, but the Reviewer flow starts at Review queue; reviewer-lands-queue expects the Review queue.
#  - The reviewer queue only shows proposals for events assigned to the signed-in reviewer by username; items from reviewer-lands-queue onward that need the queue assume the test Reviewer's username is 'test-reviewer' (security.json testUsers) as assigned in organizer-assigns-reviewer. If the session uses another username, assign that one instead.
#  - With one Attendee identity the waitlist can only be reached on an event whose capacity is 0 (Waitlist Workshop); the spec does not say whether capacity 0 is accepted, so attendee-joins-waitlist and later items assume it is. A second attendee could fill a normal capacity-2 event instead.
#  - The 'Events service failed' display state needs the backend to fail and cannot be walked.
#  - The locked 'Decision made' view of Score a proposal (scores cannot change after a decision) is not reachable by navigation, since decided proposals leave the Review queue, so it has no item.
#  - Refusal items are written for Speaker, Reviewer, Attendee and Organizer, one screen each; the grants in security.json refuse each role more screens than listed, and other screens are left out to avoid repetition.
#  - Rejecting a proposal for a session speaker assignment: before any proposal is accepted, the assign-speaker dialog shows 'No accepted talks yet'; not covered since an earlier item already accepts one.
#  - The PRD says organizers edit or delete 'an event I created', while the prototype shows Edit and Delete on every event; the walk uses a single organizer so ownership is not tested.
#  - Session capacity validation, room removal when sessions use it, session deletion when registrations exist, session waitlists and reviewers scoring their own proposal need data or identities the UI cannot create from an empty database (a second user, or a user who is both speaker and reviewer), so they have no items.

