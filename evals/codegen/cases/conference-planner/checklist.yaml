    role: Organizer
    screen: Events
    flow: Create an event and schedule sessions
    steps: Look at the screen the app opens on.
    expect: The Events screen shows with a 'New event' button, and the list reads as empty with 'No events yet' (the empty state) since nothing exists.
    weight: 1
