openapi: 3.0.3
info:
  title: Registration Service
  version: 0.1.0
  description: Seat capacity, registrations and waitlists. Called only by the events API.
servers:
  - url: /
paths:
  /targets/{targetType}/{targetId}/capacity:
    parameters:
      - $ref: '#/components/parameters/TargetType'
      - $ref: '#/components/parameters/TargetId'
    put:
      operationId: setTargetCapacity
      summary: Set a target's seat capacity and promote waitlisted people into new seats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Capacity set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /registrations:
    get:
      operationId: listRegistrations
      summary: List registrations
      parameters:
        - { name: personId, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string, enum: [event, session] } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: eventId, in: query, description: Match the event and all its sessions, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of registrations
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Registration' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createRegistration
      summary: Register a person; confirmed when a seat is free, else waitlisted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, personId]
              properties:
                targetType: { type: string, enum: [event, session] }
                targetId: { type: string }
                eventId: { type: string, description: Owning event, set for a session target }
                personId: { type: string }
      responses:
        '201':
          description: Registration created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Registration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /registrations/{registrationId}:
    parameters:
      - { name: registrationId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteRegistration
      summary: Cancel a registration, then promote the next waitlisted person
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityResult' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    TargetType: { name: targetType, in: path, required: true, schema: { type: string, enum: [event, session] } }
    TargetId: { name: targetId, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, default: 0 } }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflicts with current state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Registration:
      type: object
      required: [id, targetType, targetId, personId, status, queuedAt]
      properties:
        id: { type: string }
        targetType: { type: string, enum: [event, session] }
        targetId: { type: string }
        eventId: { type: string }
        personId: { type: string }
        status: { type: string, enum: [confirmed, waitlisted] }
        position: { type: integer, nullable: true, description: 1-based place in the waitlist, null when confirmed }
        queuedAt: { type: string, format: date-time }
    CapacityResult:
      type: object
      required: [seats, confirmed, waitlisted, promoted]
      properties:
        seats: { type: integer }
        confirmed: { type: integer }
        waitlisted: { type: integer }
        promoted: { type: array, items: { $ref: '#/components/schemas/Registration' }, description: Registrations promoted by this call }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
