openapi: 3.0.3
info:
  title: Onboarding API
  version: 0.1.0
servers:
  - url: /
security:
  - oauth2: []
paths:
  /me:
    get:
      operationId: getCurrentUser
      summary: The caller's username and department (derived from the department scopes the token carries)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Error' }
  /onboardings:
    get:
      operationId: listOnboardings
      summary: Every onboarding
      security:
        - oauth2: [onboardings:read]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OnboardingStatus' } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: Page of onboardings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingPage' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createOnboarding
      summary: Start an onboarding with the default tasks
      security:
        - oauth2: [onboardings:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /onboardings/{onboardingId}:
    parameters:
      - { $ref: '#/components/parameters/onboardingId' }
    get:
      operationId: getOnboarding
      summary: One onboarding with per-department counts
      security:
        - oauth2: [onboardings:read]
      responses:
        '200':
          description: Onboarding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateOnboarding
      summary: Edit the new hire's details
      security:
        - oauth2: [onboardings:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /onboardings/{onboardingId}/close:
    post:
      operationId: closeOnboarding
      summary: Close or cancel an onboarding
      security:
        - oauth2: [onboardings:manage]
      parameters:
        - { $ref: '#/components/parameters/onboardingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [closed, cancelled] }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /onboardings/{onboardingId}/tasks:
    post:
      operationId: createTask
      summary: Add a task to an onboarding
      security:
        - oauth2: [tasks:manage]
      parameters:
        - { $ref: '#/components/parameters/onboardingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /onboardings/{onboardingId}/tasks/{taskId}:
    parameters:
      - { $ref: '#/components/parameters/onboardingId' }
      - { $ref: '#/components/parameters/taskId' }
    put:
      operationId: updateTask
      summary: Edit any task
      security:
        - oauth2: [tasks:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTask
      summary: Remove any task
      security:
        - oauth2: [tasks:manage]
      responses:
        '204':
          description: Removed
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /tasks:
    get:
      operationId: listTasks
      summary: Every task, filterable
      security:
        - oauth2: [tasks:read-all]
      parameters:
        - { name: onboardingId, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { $ref: '#/components/schemas/Department' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: overdue, in: query, schema: { type: boolean }, description: Only open tasks past due, most overdue first }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: Page of tasks, soonest due first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Error' }
  /tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: Mark any task done
      security:
        - oauth2: [tasks:complete-all]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/it/tasks:
    get:
      operationId: listItTasks
      summary: IT tasks, for IT team members
      security:
        - oauth2: [tasks:read-it]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: Page of tasks, soonest due first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Error' }
  /me/it/tasks/{taskId}/complete:
    post:
      operationId: completeItTask
      summary: Mark an IT task done
      security:
        - oauth2: [tasks:update-it]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task done, completion date recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/it/tasks/{taskId}/reopen:
    post:
      operationId: reopenItTask
      summary: Reopen an IT task
      security:
        - oauth2: [tasks:update-it]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task open again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/it/tasks/{taskId}/notes:
    post:
      operationId: addItTaskNote
      summary: Add a note to an IT task
      security:
        - oauth2: [tasks:note-it]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/hr/tasks:
    get:
      operationId: listHrTasks
      summary: HR tasks, for HR team members
      security:
        - oauth2: [tasks:read-hr]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: Page of tasks, soonest due first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Error' }
  /me/hr/tasks/{taskId}/complete:
    post:
      operationId: completeHrTask
      summary: Mark an HR task done
      security:
        - oauth2: [tasks:update-hr]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task done, completion date recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/hr/tasks/{taskId}/reopen:
    post:
      operationId: reopenHrTask
      summary: Reopen an HR task
      security:
        - oauth2: [tasks:update-hr]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task open again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/hr/tasks/{taskId}/notes:
    post:
      operationId: addHrTaskNote
      summary: Add a note to an HR task
      security:
        - oauth2: [tasks:note-hr]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/facilities/tasks:
    get:
      operationId: listFacilitiesTasks
      summary: Facilities tasks, for Facilities team members
      security:
        - oauth2: [tasks:read-facilities]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: Page of tasks, soonest due first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Error' }
  /me/facilities/tasks/{taskId}/complete:
    post:
      operationId: completeFacilitiesTask
      summary: Mark a Facilities task done
      security:
        - oauth2: [tasks:update-facilities]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task done, completion date recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/facilities/tasks/{taskId}/reopen:
    post:
      operationId: reopenFacilitiesTask
      summary: Reopen a Facilities task
      security:
        - oauth2: [tasks:update-facilities]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task open again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/facilities/tasks/{taskId}/notes:
    post:
      operationId: addFacilitiesTaskNote
      summary: Add a note to a Facilities task
      security:
        - oauth2: [tasks:note-facilities]
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNote' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            onboardings:read: Every onboarding with progress
            onboardings:manage: Start, edit and close any onboarding
            tasks:read-all: Every task across departments
            tasks:manage: Add, edit and remove any task
            tasks:complete-all: Mark any task done
            tasks:read-it: IT tasks
            tasks:update-it: Complete or reopen IT tasks
            tasks:note-it: Add notes to IT tasks
            tasks:read-hr: HR tasks
            tasks:update-hr: Complete or reopen HR tasks
            tasks:note-hr: Add notes to HR tasks
            tasks:read-facilities: Facilities tasks
            tasks:update-facilities: Complete or reopen Facilities tasks
            tasks:note-facilities: Add notes to Facilities tasks
  parameters:
    limit: { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    offset: { name: offset, in: query, schema: { type: integer, default: 0 } }
    onboardingId: { name: onboardingId, in: path, required: true, schema: { type: string } }
    taskId: { name: taskId, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Department:
      type: string
      enum: [IT, HR, Facilities]
    TaskStatus:
      type: string
      enum: [open, done]
    OnboardingStatus:
      type: string
      enum: [active, closed, cancelled]
    CurrentUser:
      type: object
      required: [username]
      properties:
        username: { type: string }
        department: { $ref: '#/components/schemas/Department' }
    OnboardingInput:
      type: object
      required: [newHireName, role, startDate]
      properties:
        newHireName: { type: string }
        role: { type: string }
        startDate: { type: string, format: date }
    DepartmentSummary:
      type: object
      required: [department, openCount, doneCount]
      properties:
        department: { $ref: '#/components/schemas/Department' }
        openCount: { type: integer }
        doneCount: { type: integer }
    Onboarding:
      type: object
      required: [id, newHireName, role, startDate, status, openCount, doneCount, overdueCount]
      properties:
        id: { type: string }
        newHireName: { type: string }
        role: { type: string }
        startDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/OnboardingStatus' }
        openCount: { type: integer }
        doneCount: { type: integer }
        overdueCount: { type: integer, description: open tasks past due }
        departments:
          type: array
          items: { $ref: '#/components/schemas/DepartmentSummary' }
    OnboardingPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Onboarding' }
    TaskInput:
      type: object
      required: [title, department, dueDate]
      properties:
        title: { type: string }
        description: { type: string }
        department: { $ref: '#/components/schemas/Department' }
        dueDate: { type: string, format: date }
    TaskNote:
      type: object
      required: [id, text, authorUsername, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        authorUsername: { type: string }
        createdAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, onboardingId, newHireName, title, department, dueDate, status, overdue, dueSoon]
      properties:
        id: { type: string }
        onboardingId: { type: string }
        newHireName: { type: string, description: name of the new hire, filled by the service }
        title: { type: string }
        description: { type: string }
        department: { $ref: '#/components/schemas/Department' }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/TaskStatus' }
        completedOn: { type: string, format: date, nullable: true }
        overdue: { type: boolean, description: open and due before today }
        daysOverdue: { type: integer, description: days past due, 0 when not overdue }
        dueSoon: { type: boolean, description: open and due within 2 days }
        notes:
          type: array
          items: { $ref: '#/components/schemas/TaskNote' }
    TaskPage:
      type: object
      required: [count, overdueCount, data]
      properties:
        count: { type: integer, description: total matching items }
        overdueCount: { type: integer, description: overdue tasks among the matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
