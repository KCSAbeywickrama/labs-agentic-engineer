# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of HRCoordinator, ITStaff, FacilitiesStaff, Admin, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - Story 3 says an HR Coordinator can edit a task on a record, but the Onboarding detail screen only draws Add and Remove for tasks (no edit control), so no edit-task item was written.
#  - The HR Coordinator holds read scopes for IT and Facilities tasks, so no refusal item exists for those screens for HR; every screen of every other role is also reachable by none but the ones listed in the refusal items. IT, Facilities and Admin were only refused the dashboard, and HR only the templates, as one example per role.
#  - The 'Onboarding service failed' display state needs the backend to fail and cannot be brought about through the UI.
#  - The seeded tasks' due dates come from each template's offset relative to the start date; the spec does not give a date the tester can predict, so no item asserts seeded due dates or seeded overdue flags.
#  - Account shows the signed-in user's name and email, but nothing seeds known values, so the item expects only that they are shown.
#  - The Compact tables switch on Settings has no stated effect, so the Settings item expects only that saving works.
#  - Open question 1 (whether IT and Facilities can see each other's tasks) is deferred in the PRD; items only expect each queue to list its own department's tasks.
#  - The user menu's Account and Settings screens, and the sign-out screen, are drawn for all roles; they were walked as the HR Coordinator only.

items:
  - id: admin-lands-on-templates
    role: Admin
    screen: Task templates
    flow: Template management
    steps: Look at the screen you land on. Check the Standard checklist list.
    expect: The Task templates screen is shown with a New Template button. The list is empty and shows the empty state ('No templates').
    weight: 1
  - id: admin-template-validation
    role: Admin
    screen: Task template
    flow: Template management
    steps: Press New Template. Leave Task name and Default due offset empty. Press Save.
    expect: The Task template form stays open and shows validation errors saying the task name and the default due offset are required. No template is added.
    weight: 1
  - id: admin-creates-it-template
    role: Admin
    screen: Task templates
    flow: Template management (story 12)
    steps: Press New Template. Department IT, Task name 'Provision laptop', Default due offset 3. Press Save.
    expect: You arrive back on Task templates. A row IT / Provision laptop / 3 is listed.
    weight: 2
  - id: admin-creates-hr-template
    role: Admin
    screen: Task templates
    flow: Template management (story 12)
    steps: Press New Template. Department HR, Task name 'Send benefits packet', Default due offset 2. Press Save.
    expect: Back on Task templates, a row HR / Send benefits packet / 2 is listed next to the IT row.
    weight: 1
  - id: admin-creates-facilities-template
    role: Admin
    screen: Task templates
    flow: Template management (story 12)
    steps: Press New Template. Department Facilities, Task name 'Assign desk', Default due offset 3. Press Save.
    expect: Back on Task templates, a row Facilities / Assign desk / 3 is listed. Three templates are listed in total.
    weight: 1
  - id: admin-edits-template
    role: Admin
    screen: Task templates
    flow: Template management (story 12)
    steps: Open the 'Provision laptop' row. Change Default due offset to 4. Press Save.
    expect: You arrive on Task templates. The 'Provision laptop' row now shows 4 and the other rows are unchanged.
    weight: 1
  - id: admin-removes-template
    role: Admin
    screen: Task templates
    flow: Template management (story 12)
    steps: Press New Template, Department IT, Task name 'Throwaway', Default due offset 1, Save. Then use the Remove action on the 'Throwaway' row.
    expect: The 'Throwaway' row is gone from the list. The three other templates remain.
    weight: 1
  - id: it-lands-on-queue-empty
    role: ITStaff
    screen: IT tasks
    flow: IT task queue
    steps: Look at the screen you land on.
    expect: The IT tasks screen is shown with an Open tasks and an Overdue figure, a Status filter, and the empty state 'No tasks' because no onboarding exists yet.
    weight: 1
  - id: facilities-lands-on-queue-empty
    role: FacilitiesStaff
    screen: Facilities tasks
    flow: Facilities task queue
    steps: Look at the screen you land on.
    expect: The Facilities tasks screen is shown with an Open tasks and an Overdue figure, a Status filter, and the empty state 'No tasks' because no onboarding exists yet.
    weight: 1
  - id: hr-lands-on-dashboard-empty
    role: HRCoordinator
    screen: Active onboardings
    flow: Manage onboarding
    steps: Look at the screen you land on.
    expect: The Active Onboardings dashboard is shown with a New Onboarding button. The list is empty and shows the empty state 'No onboardings yet'.
    weight: 1
  - id: hr-new-onboarding-validation
    role: HRCoordinator
    screen: New onboarding
    flow: Manage onboarding
    steps: Press New Onboarding. Leave New hire name and Start date empty. Press Create.
    expect: The New onboarding form stays open and shows validation errors that the new hire name and the start date are required. No onboarding is created.
    weight: 1
  - id: hr-creates-onboarding
    role: HRCoordinator
    screen: Onboarding detail
    flow: Create onboarding (stories 1, 2)
    steps: On New onboarding, enter New hire name 'Jane Doe' and Start date 2026-03-02. Press Create. Uses the templates created by the Admin items.
    expect: "You arrive on the Onboarding detail screen for Jane Doe, showing start date 2026-03-02 and status In progress. The Tasks list holds tasks seeded from the templates: Provision laptop (IT), Send benefits packet (HR) and Assign desk (Facilities), each with a due date."
    weight: 2
  - id: hr-dashboard-lists-onboarding
    role: HRCoordinator
    screen: Active onboardings
    flow: Dashboard (story 9)
    steps: Use the Active onboardings breadcrumb to go to the dashboard. Look at the Jane Doe row.
    expect: A row for Jane Doe with start date 2026-03-02 is listed with status In progress and with IT, HR and Facilities completion shown separately for her tasks.
    weight: 2
  - id: hr-new-onboarding-cancel
    role: HRCoordinator
    screen: Active onboardings
    flow: Manage onboarding
    steps: Press New Onboarding. Enter New hire name 'Not Saved'. Press Cancel.
    expect: You arrive back on the dashboard. No 'Not Saved' row is listed.
    weight: 1
  - id: hr-add-task-validation
    role: HRCoordinator
    screen: Add task
    flow: Add task (story 3)
    steps: Open the Jane Doe row. Press Add Task. Leave Task name and Due date empty. Press Save.
    expect: The Add task form stays open and shows validation errors that the task name and the due date are required.
    weight: 1
  - id: hr-adds-overdue-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: Add task (stories 3, 4, 10)
    steps: On Add task for Jane Doe, choose Department IT, Task name 'Collect old laptop', Due date 2020-01-01, Notes 'From previous role'. Press Save.
    expect: You arrive on Jane Doe's Onboarding detail. A row IT / Collect old laptop / 2020-01-01 is listed and its status is flagged as Overdue.
    weight: 2
  - id: hr-adds-hr-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: Add task (story 3)
    steps: Press Add Task. Department HR, Task name 'Temp task', Due date 2030-01-01. Press Save.
    expect: A row HR / Temp task / 2030-01-01 is listed on Jane Doe's detail, not flagged as overdue.
    weight: 1
  - id: hr-add-task-cancel
    role: HRCoordinator
    screen: Onboarding detail
    flow: Add task
    steps: Press Add Task. Enter Task name 'Discarded'. Press Cancel.
    expect: You arrive back on Jane Doe's Onboarding detail. No 'Discarded' task is listed.
    weight: 1
  - id: hr-removes-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: Remove task (story 3)
    steps: Use the Remove action on the 'Temp task' row.
    expect: The 'Temp task' row is gone from Jane Doe's task list. The other tasks remain.
    weight: 1
  - id: hr-dashboard-flags-overdue
    role: HRCoordinator
    screen: Active onboardings
    flow: Overdue flagging (story 10)
    steps: Use the Active onboardings breadcrumb. Look at the Jane Doe row.
    expect: The Jane Doe row is marked as having overdue tasks (Overdue shows Yes), and the 'With overdue tasks' figure counts at least one onboarding.
    weight: 2
  - id: hr-cannot-complete-early
    role: HRCoordinator
    screen: Onboarding detail
    flow: Complete onboarding (story 11)
    steps: Open the Jane Doe row. Look at the Mark Complete button and try to press it while tasks are still pending.
    expect: A note says every task across all departments must be complete before the onboarding can be closed. Jane Doe's status stays In progress.
    weight: 1
  - id: hr-works-hr-task
    role: HRCoordinator
    screen: HR tasks
    flow: HR task queue
    steps: Open HR Tasks from the navigation. On the 'Send benefits packet' row for Jane Doe, use Mark in progress. Then set the Status filter to In progress.
    expect: The HR tasks screen lists the HR task for Jane Doe with status In progress. With the In progress filter the row is shown.
    weight: 1
  - id: hr-completes-hr-task
    role: HRCoordinator
    screen: HR tasks
    flow: HR task queue
    steps: Set the Status filter to All. On the 'Send benefits packet' row use Mark complete.
    expect: The row's status shows Complete.
    weight: 1
  - id: it-queue-shows-tasks-overdue
    role: ITStaff
    screen: IT tasks
    flow: IT task queue (stories 5, 10)
    steps: Open the IT tasks screen. Look at the list with the filter on All.
    expect: Rows for Jane Doe show 'Provision laptop' and 'Collect old laptop'. 'Collect old laptop' (due 2020-01-01) is flagged Overdue. No HR or Facilities tasks are listed. The Overdue figure is at least 1.
    weight: 1
  - id: it-marks-in-progress
    role: ITStaff
    screen: IT tasks
    flow: IT task queue (story 6)
    steps: On the 'Provision laptop' row use Mark in progress.
    expect: The 'Provision laptop' row shows status In progress.
    weight: 1
  - id: it-filters-status
    role: ITStaff
    screen: IT tasks
    flow: IT task queue
    steps: Set the Status filter to In progress. Then set it to Complete. Then set it back to All.
    expect: With In progress, 'Provision laptop' is listed and 'Collect old laptop' is not. With Complete, neither is listed and the empty state shows. With All, both are listed.
    weight: 1
  - id: it-marks-complete
    role: ITStaff
    screen: IT tasks
    flow: IT task queue (story 6)
    steps: On the 'Provision laptop' row use Mark complete. Then on the 'Collect old laptop' row use Mark complete.
    expect: Both rows show status Complete. 'Collect old laptop' is no longer flagged Overdue.
    weight: 2
  - id: facilities-queue-shows-task
    role: FacilitiesStaff
    screen: Facilities tasks
    flow: Facilities task queue (story 7)
    steps: Open the Facilities tasks screen.
    expect: A row for Jane Doe with 'Assign desk' is listed. No IT or HR tasks are listed.
    weight: 1
  - id: facilities-marks-in-progress
    role: FacilitiesStaff
    screen: Facilities tasks
    flow: Facilities task queue (story 8)
    steps: On the 'Assign desk' row use Mark in progress.
    expect: The 'Assign desk' row shows status In progress.
    weight: 1
  - id: facilities-marks-complete
    role: FacilitiesStaff
    screen: Facilities tasks
    flow: Facilities task queue (story 8)
    steps: On the 'Assign desk' row use Mark complete.
    expect: The row shows status Complete.
    weight: 2
  - id: hr-dashboard-shows-progress
    role: HRCoordinator
    screen: Active onboardings
    flow: Dashboard (story 9)
    steps: Open Dashboard from the navigation. Look at the Jane Doe row.
    expect: The IT, HR and Facilities columns for Jane Doe show every task done in each department, and Overdue shows No.
    weight: 1
  - id: hr-marks-onboarding-complete
    role: HRCoordinator
    screen: Onboarding detail
    flow: Complete onboarding (story 11)
    steps: Open the Jane Doe row. Press Mark Complete.
    expect: Jane Doe's status changes to Complete, and the Mark Complete button can no longer be used. On the dashboard Jane Doe is shown as Complete and the Completed figure counts her.
    weight: 2
  - id: hr-views-account
    role: HRCoordinator
    screen: Account
    flow: Account
    steps: Open the user menu in the app shell and choose Account.
    expect: The Account screen is shown with the signed-in user's name and email.
    weight: 1
  - id: hr-views-settings
    role: HRCoordinator
    screen: Settings
    flow: Settings
    steps: Open the user menu and choose Settings. Turn the Compact tables switch on and press Save settings.
    expect: The Settings screen shows a Compact tables switch and Save settings completes without a crash, returning to the app.
    weight: 1
  - id: admin-refused-dashboard
    role: Admin
    screen: Active onboardings
    flow: Role reach
    steps: Open the address the Active onboardings dashboard had in hr-lands-on-dashboard-empty.
    expect: "The Admin is refused the screen: the onboardings list and the Jane Doe record are not shown."
    weight: 1
  - id: it-refused-dashboard
    role: ITStaff
    screen: Active onboardings
    flow: Role reach
    steps: Open the address the Active onboardings dashboard had in hr-lands-on-dashboard-empty.
    expect: "IT Staff is refused the screen: the onboardings list and the Jane Doe record are not shown."
    weight: 1
  - id: facilities-refused-dashboard
    role: FacilitiesStaff
    screen: Active onboardings
    flow: Role reach
    steps: Open the address the Active onboardings dashboard had in hr-lands-on-dashboard-empty.
    expect: "Facilities Staff is refused the screen: the onboardings list and the Jane Doe record are not shown."
    weight: 1
  - id: hr-refused-templates
    role: HRCoordinator
    screen: Task templates
    flow: Role reach
    steps: Open the address the Task templates screen had in admin-lands-on-templates.
    expect: "The HR Coordinator is refused the screen: the template list is not shown."
    weight: 1
  - id: no-role-sees-no-access
    role: no role
    screen: No access
    flow: Role reach
    steps: Look at the screen the app shows.
    expect: "A no-access page is shown instead of the app: no dashboard, task lists or templates."
    weight: 1
  - id: signed-out-guard-signs-in
    role: signed out
    screen: Active onboardings
    flow: Role reach
    steps: Load the app while signed out and wait.
    expect: The address loses 'auth=out' and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: hr-signs-out
    role: HRCoordinator
    screen: No access
    flow: Sign out
    steps: Open the user menu and choose sign out.
    expect: You arrive at the app's root, the previous role's screens and data are gone and the no-access state shows. No sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
