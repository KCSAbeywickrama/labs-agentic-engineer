# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of HRCoordinator, ITStaff, FacilitiesStaff, Admin, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - HR Coordinator holds read grants for IT tasks and Facilities tasks, so no refusal item is written for those screens; likewise no refusal for HR on the dashboard and detail screens, and the prototype draws no navigation to the queues for HR.
#  - Seeded task due dates are specified inconsistently (prototype sets them to the start date, the API describes template offsets), so the items check due dates only on tasks the tester enters; the future start date 2027-03-01 is chosen so seeded tasks are not overdue.
#  - The prototype's Edit task dialog has an editable Status field, while the API's task edit takes only name, due date and notes; hr-completes-own-task relies on the prototype and on the HR Coordinator's hr-tasks:update grant.
#  - No screen lists HR tasks across all hires (an HR task API exists), so HR task status can only be changed from the Onboarding detail edit dialog.
#  - The PRD says task templates seed new records; whether editing or removing a template changes existing records is not specified, so no item checks it.
#  - The Account, Settings and Signed out prototype screens are outside the flows and the PRD stories, so they are not covered; the Signed out screen's Sign in button cannot appear in wired mode.
#  - Nothing specifies behaviour when the Onboarding detail screen is opened for a record that does not exist, so no item covers it.

items:
  - id: admin-lands-on-templates
    role: Admin
    screen: Task templates
    flow: Maintain standard task templates
    steps: Look at the screen the app opened on.
    expect: The Task templates screen is shown with a New template button. With nothing created yet the table shows an empty state saying there are no task templates, with a New template button.
    weight: 1
  - id: admin-creates-it-template
    role: Admin
    screen: Task templates
    flow: "Story F4.1: manage templates"
    steps: Click New template. Choose Department IT, Task name 'Provision laptop', Default due offset (days) -2. Click Create template.
    expect: The dialog closes and the table lists a row for department IT, task 'Provision laptop', offset -2. The empty state is gone.
    weight: 2
  - id: admin-creates-hr-template
    role: Admin
    screen: Task templates
    flow: "Story F4.1: manage templates"
    steps: Click New template. Choose Department HR, Task name 'Collect tax forms', Default due offset (days) 1. Click Create template.
    expect: The table lists a new row for department HR, task 'Collect tax forms', offset 1, alongside the IT row.
    weight: 1
  - id: admin-creates-facilities-template
    role: Admin
    screen: Task templates
    flow: "Story F4.1: manage templates"
    steps: Click New template. Choose Department Facilities, Task name 'Assign desk', Default due offset (days) 0. Click Create template.
    expect: The table lists a new row for department Facilities, task 'Assign desk', offset 0.
    weight: 1
  - id: admin-creates-extra-template
    role: Admin
    screen: Task templates
    flow: "Story F4.1: manage templates"
    steps: Click New template. Choose Department Facilities, Task name 'Parking pass', Default due offset (days) 3. Click Create template.
    expect: The table lists a row for department Facilities, task 'Parking pass', offset 3. The Standard tasks section count includes it.
    weight: 1
  - id: admin-edits-template
    role: Admin
    screen: Task templates
    flow: "Story F4.1: manage templates"
    steps: On the 'Provision laptop' row click Edit. Change Task name to 'Provision laptop and dock' and Default due offset (days) to -3. Click Save.
    expect: The dialog closes and the IT row now reads 'Provision laptop and dock' with offset -3. The row for 'Provision laptop' no longer appears.
    weight: 2
  - id: admin-removes-template
    role: Admin
    screen: Task templates
    flow: "Story F4.1: manage templates"
    steps: On the 'Parking pass' row (created in admin-creates-extra-template) click Remove.
    expect: The 'Parking pass' row disappears from the table. The other three templates remain.
    weight: 2
  - id: hr-lands-on-dashboard
    role: HRCoordinator
    screen: Dashboard
    flow: Monitor onboarding progress
    steps: Look at the screen the app opened on.
    expect: The Onboarding dashboard is shown with a New onboarding button, an Active onboardings figure of 0 and an Overdue tasks figure of 0. The new hires table shows an empty state saying there are no onboarding records yet, with a New onboarding button.
    weight: 1
  - id: hr-opens-new-onboarding-form
    role: HRCoordinator
    screen: New onboarding
    flow: Start a new hire's onboarding
    steps: Click New onboarding.
    expect: The 'Start a new onboarding' screen opens with a breadcrumb back to Dashboard, a New hire name field, a Start date field and a Create onboarding button.
    weight: 1
  - id: hr-new-onboarding-requires-name
    role: HRCoordinator
    screen: New onboarding
    flow: Start a new hire's onboarding
    steps: On the New onboarding screen leave New hire name empty, set Start date 2027-03-01, click Create onboarding.
    expect: No onboarding is created and the screen stays on the form, indicating the new hire name is required.
    weight: 1
  - id: hr-creates-onboarding
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.1, F1.2: create onboarding"
    steps: On the New onboarding screen enter New hire name 'Maya Fernando', Start date 2027-03-01. Click Create onboarding.
    expect: The Onboarding detail screen for Maya Fernando opens showing Start date 2027-03-01 and Status In progress. Under Tasks, the IT tab lists 'Provision laptop and dock', the HR tab lists 'Collect tax forms', the Facilities tab lists 'Assign desk' (and not 'Parking pass'), each with status Pending.
    weight: 2
  - id: hr-dashboard-lists-record
    role: HRCoordinator
    screen: Dashboard
    flow: "Story F3.1: dashboard"
    steps: Click the Dashboard breadcrumb.
    expect: The dashboard table lists a row for Maya Fernando with start date 2027-03-01, IT 0/1, HR 0/1, Facilities 0/1, Overdue No and status In progress. Active onboardings shows 1.
    weight: 2
  - id: hr-opens-detail-from-dashboard
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F3.1: dashboard"
    steps: On the dashboard click the Maya Fernando row. Then click the HR tab, then the Facilities tab.
    expect: The Onboarding detail screen for Maya Fernando opens. Each tab shows that department's tasks only.
    weight: 1
  - id: hr-adds-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.3, F1.4: add task"
    steps: Click Add task. Choose Department HR, Task name 'Schedule orientation', Due date 2027-03-03, Notes 'Room 4'. Click Add task in the dialog. Open the HR tab.
    expect: The dialog closes and the HR tab lists 'Schedule orientation' with due date 2027-03-03 and status Pending, next to 'Collect tax forms'.
    weight: 2
  - id: hr-adds-overdue-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F3.2: overdue flag"
    steps: Click Add task. Choose Department Facilities, Task name 'Issue badge', Due date 2026-01-01. Click Add task in the dialog. Open the Facilities tab.
    expect: "'Issue badge' is listed with due date 2026-01-01 and is visibly flagged Overdue. 'Assign desk' is not flagged Overdue."
    weight: 2
  - id: hr-edits-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.3, F1.4: edit task"
    steps: Open the HR tab. On the 'Collect tax forms' row click Edit. Change Task name to 'Collect tax and bank forms', Due date to 2027-03-05, Notes to 'Bring ID'. Click Save.
    expect: The dialog closes and the HR tab shows 'Collect tax and bank forms' with due date 2027-03-05.
    weight: 2
  - id: hr-removes-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.3: remove task"
    steps: On the HR tab click Remove on the 'Schedule orientation' row.
    expect: "'Schedule orientation' disappears from the HR tab. 'Collect tax and bank forms' remains."
    weight: 2
  - id: hr-dashboard-flags-overdue
    role: HRCoordinator
    screen: Dashboard
    flow: "Story F3.2: overdue flag"
    steps: Click the Dashboard breadcrumb.
    expect: The Maya Fernando row shows Overdue Yes, and the Overdue tasks figure shows 1. The department counts now read IT 0/1, HR 0/1, Facilities 0/2.
    weight: 2
  - id: hr-cannot-complete-early
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.5: complete onboarding"
    steps: Open the Maya Fernando row. Try to click Mark onboarding complete.
    expect: "Onboarding cannot be marked complete while tasks are still pending: the status stays In progress."
    weight: 1
  - id: it-lands-on-queue
    role: ITStaff
    screen: IT task queue
    flow: "Story F2.1: IT task queue"
    steps: Look at the screen the app opened on.
    expect: The IT tasks screen is shown with an Overdue figure of 0 and a Status filter. The table lists a row for new hire Maya Fernando, task 'Provision laptop and dock', status Pending. No HR or Facilities tasks are listed.
    weight: 2
  - id: it-marks-in-progress
    role: ITStaff
    screen: IT task queue
    flow: "Story F2.2: update IT task"
    steps: On the 'Provision laptop and dock' row choose Mark in-progress.
    expect: The row's status changes to In progress.
    weight: 2
  - id: it-filters-by-status
    role: ITStaff
    screen: IT task queue
    flow: "Story F2.1: IT task queue"
    steps: Set the Status filter to in-progress.
    expect: The table lists 'Provision laptop and dock' for Maya Fernando with status In progress.
    weight: 1
  - id: it-marks-complete
    role: ITStaff
    screen: IT task queue
    flow: "Story F2.2: update IT task"
    steps: Set the Status filter back to all. On the 'Provision laptop and dock' row choose Mark complete.
    expect: The row's status shows Complete.
    weight: 2
  - id: facilities-lands-on-queue
    role: FacilitiesStaff
    screen: Facilities task queue
    flow: "Story F2.3: Facilities task queue"
    steps: Look at the screen the app opened on.
    expect: The Facilities tasks screen is shown with an Overdue figure of 1 and a Status filter. The table lists Maya Fernando's 'Assign desk' (Pending) and 'Issue badge' (flagged Overdue). No IT or HR tasks are listed.
    weight: 2
  - id: facilities-marks-in-progress
    role: FacilitiesStaff
    screen: Facilities task queue
    flow: "Story F2.4: update Facilities task"
    steps: On the 'Assign desk' row choose Mark in-progress.
    expect: The 'Assign desk' row's status changes to In progress.
    weight: 2
  - id: facilities-filters-by-status
    role: FacilitiesStaff
    screen: Facilities task queue
    flow: "Story F2.3: Facilities task queue"
    steps: Set the Status filter to in-progress.
    expect: The table lists 'Assign desk' with status In progress.
    weight: 1
  - id: facilities-marks-complete
    role: FacilitiesStaff
    screen: Facilities task queue
    flow: "Story F2.4: update Facilities task"
    steps: Set the Status filter back to all. On 'Assign desk' choose Mark complete, then on 'Issue badge' choose Mark complete.
    expect: Both rows show Complete. The 'Issue badge' row is no longer flagged Overdue and the Overdue figure shows 0.
    weight: 2
  - id: hr-completes-own-task
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.5: complete onboarding"
    steps: Open the Maya Fernando row from the dashboard. On the HR tab click Edit on 'Collect tax and bank forms', set Status to complete, click Save.
    expect: The HR tab shows 'Collect tax and bank forms' with status Complete.
    weight: 1
  - id: hr-marks-onboarding-complete
    role: HRCoordinator
    screen: Onboarding detail
    flow: "Story F1.5: complete onboarding"
    steps: With every task for Maya Fernando now complete, click Mark onboarding complete.
    expect: The Status in the record details reads Complete.
    weight: 2
  - id: hr-dashboard-shows-complete
    role: HRCoordinator
    screen: Dashboard
    flow: "Story F3.1: dashboard"
    steps: Click the Dashboard breadcrumb.
    expect: The Maya Fernando row shows IT 1/1, HR 1/1, Facilities 2/2, Overdue No and status Complete. Active onboardings shows 0.
    weight: 1
  - id: hr-refused-templates
    role: HRCoordinator
    screen: Task templates
    flow: Role reach
    steps: Open the address the Task templates screen had in admin-lands-on-templates.
    expect: The task templates are not shown to the HR Coordinator; the app refuses the screen without crashing.
    weight: 1
  - id: it-refused-dashboard
    role: ITStaff
    screen: Dashboard
    flow: Role reach
    steps: Open the address the Dashboard had in hr-lands-on-dashboard.
    expect: No onboarding records are shown to IT Staff; the app refuses the screen without crashing.
    weight: 1
  - id: facilities-refused-it-queue
    role: FacilitiesStaff
    screen: IT task queue
    flow: Role reach
    steps: Open the address the IT task queue had in it-lands-on-queue.
    expect: No IT tasks are shown to Facilities Staff; the app refuses the screen without crashing.
    weight: 1
  - id: admin-refused-dashboard
    role: Admin
    screen: Dashboard
    flow: Role reach
    steps: Open the address the Dashboard had in hr-lands-on-dashboard.
    expect: No onboarding records are shown to the Admin; the app refuses the screen without crashing.
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: No access
    flow: Role reach
    steps: Look at what the app shows.
    expect: "A no-access page is shown instead of the app: no dashboard, task queue or templates."
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: Dashboard
    flow: Role reach
    steps: Load the app while nobody is signed in.
    expect: The address loses auth=out and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: sign-out
    role: HRCoordinator
    screen: No access
    flow: Sign out
    steps: Open the user menu and choose Sign out.
    expect: The Dashboard and onboarding data are gone and the app shows its no-access state, with no sign-in form.
    weight: 1
extras:
  mustCover: []
  mustNot: []
