openapi: 3.0.3
info:
  title: Inventory Service
  version: 0.1.0
  description: Items, stock levels and the append-only stock ledger. Called only by the procurement API.
servers:
  - url: /
paths:
  /items:
    get:
      operationId: listItems
      summary: List items with current stock
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search by name or SKU }
        - { name: ids, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false, description: Restrict to these item ids }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Items page
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Item' } }
    post:
      operationId: createItem
      summary: Create an item at zero stock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemCreate' }
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /items/{itemId}:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getItem
      summary: Get one item with current stock
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateItem
      summary: Edit an item; the SKU never changes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemUpdate' }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ledger-entries:
    get:
      operationId: listLedgerEntries
      summary: List ledger entries, newest first
      parameters:
        - { name: itemId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Ledger page
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching entries }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: appendLedgerEntries
      summary: Append ledger entries atomically; each changes its item's stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/LedgerEntryInput' }
      responses:
        '201':
          description: Entries appended
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LedgerEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /low-stock:
    get:
      operationId: listLowStock
      summary: Active items strictly below their reorder level
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [shortfall, name], default: shortfall } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Low-stock items
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/LowStockItem' } }
components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such item
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: SKU already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Item:
      type: object
      required: [id, sku, name, unitOfMeasure, reorderLevel, unitPriceCents, active, stockQuantity]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        unitOfMeasure: { type: string }
        reorderLevel: { type: integer }
        unitPriceCents: { type: integer, description: price in cents of the company currency }
        active: { type: boolean }
        stockQuantity: { type: integer, description: sum of the item's ledger entries }
    ItemCreate:
      type: object
      required: [sku, name, unitOfMeasure, reorderLevel, unitPriceCents]
      properties:
        sku: { type: string }
        name: { type: string }
        unitOfMeasure: { type: string }
        reorderLevel: { type: integer, minimum: 0 }
        unitPriceCents: { type: integer, minimum: 0 }
    ItemUpdate:
      type: object
      properties:
        name: { type: string }
        unitOfMeasure: { type: string }
        reorderLevel: { type: integer, minimum: 0 }
        unitPriceCents: { type: integer, minimum: 0 }
        active: { type: boolean }
    LowStockItem:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [shortfall]
          properties:
            shortfall: { type: integer, description: reorder level minus current stock }
    LedgerEntryInput:
      type: object
      required: [itemId, quantityChange, actorId, actorName, sourceType, sourceId]
      properties:
        itemId: { type: string }
        quantityChange: { type: integer, description: signed; positive raises stock }
        actorId: { type: string, description: user id supplied by the procurement API }
        actorName: { type: string }
        sourceType: { type: string, enum: [receipt] }
        sourceId: { type: string }
        requestId: { type: string }
    LedgerEntry:
      allOf:
        - $ref: '#/components/schemas/LedgerEntryInput'
        - type: object
          required: [id, itemName, resultingQuantity, createdAt]
          properties:
            id: { type: string }
            itemName: { type: string }
            resultingQuantity: { type: integer, description: stock level after this entry }
            createdAt: { type: string, format: date-time }
