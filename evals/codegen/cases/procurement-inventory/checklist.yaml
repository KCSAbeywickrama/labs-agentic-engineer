# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Requester, Approver, Warehouse Clerk, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - Self-approval refusal (a requester cannot approve their own request) cannot be walked: no test identity holds both Requester and Approver, so no item exists; a person could add one by hand if such a user exists.
#  - Requests are scoped to the caller (a Requester sees only their own), but only one Requester identity is available by role switch, so isolation between two requesters is not checked.
#  - Beyond the Requester and Approver refusals listed, the Warehouse Clerk's grants (read-all requests) reach the Approval queue and Approval detail screens, and the Requester's grants reach the Manage catalogue screen load, so no refusal items were written for those.
#  - The Account and Settings screens are in no flow and were not walked.
#  - The prototype shows the item catalogue as read-only for Requesters and edits only item name, unit, price and reorder level; the PRD and prototype agree, but SKU and On hand are not editable anywhere.
#  - The prototype raises and receives single-line requests only, while the API allows several lines per request; multi-line behaviour is not covered.
#  - Reject requires a reason in the prototype; the API treats it as optional, so a reject without reason is not tested.
#  - Pagination (more than 20 rows) and the 'Stock feed failed' state cannot be produced through the UI from an empty database and are not covered.

items:
  - id: requester-lands-on-catalogue
    role: Requester
    screen: Catalogue
    flow: Browse the catalogue
    steps: Look at the screen the app opens on after sign-in.
    expect: The Catalogue screen is shown with a 'New request' button. No items exist yet, so the items list is empty and reads sensibly (no crash, no blank page).
    weight: 1
  - id: requester-my-requests-empty
    role: Requester
    screen: My requests
    flow: Follow my requests
    steps: In the navigation choose 'My requests'.
    expect: The My requests screen loads and lists no requests yet, with an empty state rather than an error.
    weight: 1
  - id: approver-lands-on-queue
    role: Approver
    screen: Approval queue
    flow: Review pending requests
    steps: Look at the screen the app opens on after sign-in.
    expect: The Approval queue screen is shown with nothing awaiting decision (count 0) and an empty state reading as nothing pending.
    weight: 1
  - id: clerk-lands-on-orders
    role: Warehouse Clerk
    screen: Orders to receive
    flow: Receive goods against an order
    steps: Look at the screen the app opens on after sign-in.
    expect: The Orders to receive screen is shown with no approved orders yet and an empty state reading as nothing to receive.
    weight: 1
  - id: clerk-stock-empty
    role: Warehouse Clerk
    screen: Stock
    flow: View the low-stock view
    steps: In the navigation choose 'Stock & low stock'.
    expect: The Stock screen loads with a stock levels list and a Low stock list, both empty with an empty state; no error is shown.
    weight: 1
  - id: clerk-adds-item
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Add a catalogue item
    steps: In the navigation choose 'Catalogue'. Press 'Add item'. Enter Name 'Laptop Stand', Unit 'unit', Unit price 32, Reorder level 10. Press 'Add item' in the dialog.
    expect: The dialog closes and 'Laptop Stand' is listed in the catalogue table with unit 'unit', unit price $32.00, reorder level 10 and On hand 0.
    weight: 2
  - id: clerk-adds-second-item
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Add a catalogue item
    steps: Press 'Add item'. Enter Name 'Office Chair', Unit 'unit', Unit price 145, Reorder level 5. Press 'Add item' in the dialog.
    expect: "'Office Chair' is listed with unit price $145.00, reorder level 5 and On hand 0, alongside 'Laptop Stand'."
    weight: 1
  - id: clerk-edits-item
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Edit a catalogue item
    steps: On the 'Laptop Stand' row use the 'Edit' action. Change Unit price to 35 and Reorder level to 8, leave Name and Unit unchanged. Press 'Save'.
    expect: The dialog closes and the 'Laptop Stand' row shows unit price $35.00 and reorder level 8; its name, unit and On hand 0 are unchanged.
    weight: 2
  - id: clerk-low-stock-lists-new-items
    role: Warehouse Clerk
    screen: Stock
    flow: View the low-stock view
    steps: In the navigation choose 'Stock & low stock'.
    expect: Stock levels lists 'Laptop Stand' (on hand 0, reorder level 8) and 'Office Chair' (on hand 0, reorder level 5). The Low stock list also lists both, since 0 is below their reorder levels.
    weight: 2
  - id: clerk-ledger-empty
    role: Warehouse Clerk
    screen: Item ledger
    flow: View an item's ledger
    steps: On the Stock screen open the 'Laptop Stand' row in the Stock levels table.
    expect: The Item ledger screen for Laptop Stand opens showing On hand 0, reorder level 8 and no ledger entries (empty state). A 'Stock' breadcrumb leads back to the Stock screen.
    weight: 1
  - id: requester-browses-catalogue
    role: Requester
    screen: Catalogue
    flow: Browse the catalogue
    steps: In the navigation choose 'Catalogue'.
    expect: The catalogue lists 'Laptop Stand' (unit, $35.00, on hand 0) and 'Office Chair' (unit, $145.00, on hand 0), each with a 'Request' action.
    weight: 2
  - id: requester-raises-request
    role: Requester
    screen: My requests
    flow: Raise a purchase request
    steps: On the Laptop Stand row press 'Request'. On Raise a purchase request check the Item is 'Laptop Stand', set Quantity 10 and press 'Raise request'.
    expect: You arrive on My requests, where a new request for Laptop Stand with total value $350.00 is listed with a Pending status.
    weight: 2
  - id: requester-raises-over-limit-request
    role: Requester
    screen: My requests
    flow: Raise a purchase request
    steps: In the navigation choose 'Catalogue', press 'New request', choose Item 'Office Chair', Quantity 40, press 'Raise request'.
    expect: My requests lists a new Office Chair request with total value $5800.00 and a Pending status.
    weight: 1
  - id: requester-raises-small-request
    role: Requester
    screen: My requests
    flow: Raise a purchase request
    steps: Press 'Catalogue' in the navigation, press 'Request' on the Office Chair row, set Quantity 2 and press 'Raise request'.
    expect: My requests lists a new Office Chair request with total value $290.00 and a Pending status.
    weight: 1
  - id: requester-rejects-zero-quantity
    role: Requester
    screen: Raise a request
    flow: Raise a purchase request
    steps: Press 'Catalogue', press 'New request', choose Item 'Laptop Stand', set Quantity 0 and press 'Raise request'.
    expect: "No request is raised: the form stays on screen. After opening 'My requests' it still lists only the three earlier requests."
    weight: 1
  - id: requester-opens-request-detail
    role: Requester
    screen: Request detail
    flow: Follow my requests
    steps: In 'My requests' open the Laptop Stand request with total $350.00.
    expect: Request detail shows Status Pending, Total value $350.00, Decided by and Reason as '—', and an Items table with Laptop Stand, quantity 10, unit price $35.00, received 0. The 'My requests' breadcrumb leads back to the list.
    weight: 1
  - id: approver-sees-pending-requests
    role: Approver
    screen: Approval queue
    flow: Review pending requests
    steps: Look at the Approval queue (open it through the navigation if needed).
    expect: Awaiting decision shows 3. The Pending requests table lists three requests with totals $350.00, $5800.00 and $290.00, each with a Pending status and the requester's name.
    weight: 2
  - id: approver-approves-request
    role: Approver
    screen: Approval queue
    flow: Approve or reject a request
    steps: Open the request with total $350.00. Check the detail shows the item Laptop Stand, quantity 10. Press 'Approve'.
    expect: You return to the Approval queue and the $350.00 request is no longer listed as pending; 2 are awaiting decision.
    weight: 2
  - id: approver-over-limit-refused
    role: Approver
    screen: Approval detail
    flow: Approve or reject a request
    steps: In the Approval queue open the request with total $5800.00 and try to approve it with 'Approve'.
    expect: The request is not approved. The screen states that the total $5800.00 is above the approval limit of $5000.00. After returning to the queue the request is still listed as Pending.
    weight: 2
  - id: approver-rejects-request
    role: Approver
    screen: Approval queue
    flow: Approve or reject a request
    steps: Open the request with total $290.00, press 'Reject', enter Reason 'Not budgeted this quarter' and press 'Reject' in the dialog.
    expect: You return to the Approval queue and the $290.00 request is no longer listed as pending; only the $5800.00 request remains.
    weight: 2
  - id: requester-sees-decided-statuses
    role: Requester
    screen: My requests
    flow: Follow my requests
    steps: In the navigation choose 'My requests'.
    expect: The $350.00 request shows Approved, the $290.00 request shows Rejected and the $5800.00 request shows Pending.
    weight: 2
  - id: requester-sees-rejection-reason
    role: Requester
    screen: Request detail
    flow: Follow my requests
    steps: Open the $290.00 request.
    expect: Request detail shows Status Rejected and the Reason 'Not budgeted this quarter'; Decided by is filled in.
    weight: 1
  - id: clerk-sees-approved-order
    role: Warehouse Clerk
    screen: Orders to receive
    flow: Receive goods against an order
    steps: In the navigation choose 'Orders to receive'.
    expect: The Approved orders table lists the Laptop Stand order with status Approved. The pending $5800.00 and rejected $290.00 requests are not listed.
    weight: 2
  - id: clerk-receives-partial
    role: Warehouse Clerk
    screen: Orders to receive
    flow: Receive goods against an order
    steps: Open the Laptop Stand order. Check Ordered 10, Received so far 0, Outstanding 10. Set Quantity received 4 and press 'Record receipt'.
    expect: You arrive back on Orders to receive and the Laptop Stand order is still listed, now with status Partially received.
    weight: 2
  - id: clerk-over-receipt-refused
    role: Warehouse Clerk
    screen: Receive goods
    flow: Receive goods against an order
    steps: Open the Laptop Stand order again. Check Received so far 4 and Outstanding 6. Set Quantity received 7 and press 'Record receipt'.
    expect: "The receipt is not recorded: the order still shows Received so far 4 and Outstanding 6."
    weight: 1
  - id: clerk-receives-remainder
    role: Warehouse Clerk
    screen: Orders to receive
    flow: Receive goods against an order
    steps: On the Receive goods screen for the Laptop Stand order set Quantity received 6 and press 'Record receipt'.
    expect: You arrive on Orders to receive and the Laptop Stand order is no longer listed as open.
    weight: 2
  - id: clerk-ledger-shows-receipts
    role: Warehouse Clerk
    screen: Item ledger
    flow: View an item's ledger
    steps: Choose 'Stock & low stock' and open the Laptop Stand row.
    expect: "The ledger shows On hand 10 and two entries, newest first: +6 with balance after 10, then +4 with balance after 4, each with reason goods-receipt and a reference to the receipt."
    weight: 2
  - id: clerk-low-stock-after-receipt
    role: Warehouse Clerk
    screen: Stock
    flow: View the low-stock view
    steps: Press the 'Stock' breadcrumb.
    expect: Stock levels shows Laptop Stand with on hand 10 and Office Chair with on hand 0. The Low stock list no longer contains Laptop Stand but still contains Office Chair.
    weight: 2
  - id: requester-sees-received-status
    role: Requester
    screen: Request detail
    flow: Follow my requests
    steps: Open 'My requests' and open the $350.00 request.
    expect: The list shows the request as Received. The detail shows Status Received and the Laptop Stand line with quantity 10 and received 10.
    weight: 1
  - id: requester-refused-approval-queue
    role: Requester
    screen: Approval queue
    flow: Role access
    steps: Open the address the Approval Queue had in approver-lands-on-queue.
    expect: The Approval queue and its requests are not shown to the Requester; access is refused.
    weight: 1
  - id: requester-refused-stock
    role: Requester
    screen: Stock
    flow: Role access
    steps: Open the address the Stock screen had in clerk-stock-empty.
    expect: The Stock screen and its data are not shown to the Requester; access is refused.
    weight: 1
  - id: approver-refused-catalogue
    role: Approver
    screen: Catalogue
    flow: Role access
    steps: Open the address the Catalogue had in requester-lands-on-catalogue.
    expect: The catalogue is not shown to the Approver; access is refused.
    weight: 1
  - id: approver-refused-stock
    role: Approver
    screen: Stock
    flow: Role access
    steps: Open the address the Stock screen had in clerk-stock-empty.
    expect: The Stock screen and its data are not shown to the Approver; access is refused.
    weight: 1
  - id: clerk-refused-my-requests
    role: Warehouse Clerk
    screen: My requests
    flow: Role access
    steps: Open the address My requests had in requester-my-requests-empty.
    expect: The My requests screen and the requester's requests are not shown to the Warehouse Clerk; access is refused.
    weight: 1
  - id: no-role-sees-no-access
    role: no role
    screen: Catalogue
    flow: Role access
    steps: Look at what the app shows after loading.
    expect: A no-access page is shown instead of the app; no catalogue, requests, orders or stock data appear.
    weight: 1
  - id: signed-out-guard-restores-session
    role: signed out
    screen: Catalogue
    flow: Role access
    steps: Load the app with nobody signed in and wait for it to settle.
    expect: The app's own sign-in guard runs and the app reloads into a session without a blank page or crash; the address no longer contains the signed-out marker.
    weight: 1
  - id: requester-signs-out
    role: Requester
    screen: Signed out
    flow: Sign out
    steps: Open the user menu and choose the sign-out control.
    expect: The Requester's screens and data are gone and the app's no-access state is shown; no sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
