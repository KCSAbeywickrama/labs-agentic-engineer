# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Requester, Approver, Warehouse Clerk, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - The prototype's Signed out screen (with a Sign in button) is not walkable: sign-out must show the no-access state, so no item covers it.
#  - The 'requester cannot approve their own request' rule (story 6 and the Cannot approve alert) is not walkable: the Requester and Approver roles are separate and no UI way exists to make one user hold both.
#  - Requests from more than one requester (to confirm My requests lists only the caller's own) cannot be created: only one Requester identity can be used, so that isolation is not tested.
#  - Service failed state (all screens) needs the backend or inventory service to fail, so it is not walkable.
#  - The empty states of Pending requests after all requests are decided, and of Low stock when no item is low, are not written; only the first-load empty states are covered.
#  - Refusal items are written for one screen per role. Approver and Warehouse Clerk hold read-all, so they reach the Pending requests, Review request and Approved orders data screens; Requester and Approver also lack stock:read and Requester lacks catalogue:manage, but only one refusal per role is written.
#  - Approving a request at exactly the limit of 5000 is not covered, since the spec only states the limit and 'above the limit' refusal.
#  - The Item details screen allows a new item's SKU to be assigned by the app; the spec does not say how, so item SKUs are not asserted.
#  - If the app calls the My request detail for a request raised by another requester, refusal cannot be shown: no second requester data can be created.

items:
  - id: requester-lands-home
    role: Requester
    screen: Home
    flow: Role entry
    steps: Look at the screen shown after signing in.
    expect: The Home screen shows, with the Requester's own figures (My open requests, Catalogue items) and a Browse the catalogue button. Nothing is broken or blank.
    weight: 1
  - id: requester-empty-catalogue
    role: Requester
    screen: Catalogue
    flow: Browse and request
    steps: Click Browse the catalogue (or Catalogue in the navigation).
    expect: The Catalogue screen shows with no items and the empty message 'No items' / 'No catalogue items match.'
    weight: 1
  - id: requester-empty-my-requests
    role: Requester
    screen: My requests
    flow: Browse and request
    steps: Open My requests from the navigation.
    expect: The My requests screen shows no requests and the empty message 'No requests'.
    weight: 1
  - id: approver-lands-home
    role: Approver
    screen: Home
    flow: Role entry
    steps: Look at the screen shown after signing in.
    expect: The Home screen shows with Awaiting your decision and an Approval limit of 5000.00, plus a Review pending requests button.
    weight: 1
  - id: approver-empty-queue
    role: Approver
    screen: Pending requests
    flow: Approval queue
    steps: Click Review pending requests.
    expect: The Pending requests screen shows the Approval limit 5000.00, no requests and the empty message 'Nothing to review'.
    weight: 1
  - id: clerk-lands-home
    role: Warehouse Clerk
    screen: Home
    flow: Role entry
    steps: Look at the screen shown after signing in.
    expect: The Home screen shows with Orders to receive and Low-stock items figures and a Receive goods button.
    weight: 1
  - id: clerk-empty-receiving-queue
    role: Warehouse Clerk
    screen: Approved orders
    flow: Receive goods
    steps: Click Receive goods.
    expect: The Approved orders screen shows no orders and the empty message 'No orders to receive'.
    weight: 1
  - id: clerk-empty-stock-levels
    role: Warehouse Clerk
    screen: Stock levels
    flow: Receive goods
    steps: Open Stock levels from the navigation.
    expect: The Stock levels screen shows no items and the empty message 'No items'.
    weight: 1
  - id: clerk-empty-low-stock
    role: Warehouse Clerk
    screen: Low stock
    flow: Receive goods
    steps: Open Low stock from the navigation.
    expect: The Low stock screen shows no items and the empty message 'Nothing is low'.
    weight: 1
  - id: clerk-empty-manage-catalogue
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Manage catalogue
    steps: Open Manage catalogue from the navigation.
    expect: The Manage catalogue screen shows no items and the empty message 'No items' / 'Add the first catalogue item.' with an Add item button.
    weight: 1
  - id: clerk-add-item-validation
    role: Warehouse Clerk
    screen: Item details
    flow: Manage catalogue
    steps: On Manage catalogue click Add item. Leave Name, Unit and Unit price empty, set Reorder level 5 and click Save item.
    expect: The item is not saved; the Item details screen stays open and shows validation errors for the missing required fields (Validation errors state). The hint that a new item starts with 0 in stock is visible.
    weight: 1
  - id: clerk-adds-pens
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Manage catalogue
    steps: On Item details enter Name 'Ballpoint pens', Unit 'box', Unit price 4.50, Reorder level 10 and click Save item.
    expect: You arrive on Manage catalogue and 'Ballpoint pens' is listed with unit box, unit price 4.50 and reorder level 10, with an assigned SKU.
    weight: 2
  - id: clerk-adds-paper
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Manage catalogue
    steps: Click Add item. Enter Name 'A4 paper', Unit 'ream', Unit price 6.20, Reorder level 15 and click Save item.
    expect: You arrive on Manage catalogue and 'A4 paper' is listed with unit ream, unit price 6.20, reorder level 15.
    weight: 1
  - id: clerk-adds-toner
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Manage catalogue
    steps: Click Add item. Enter Name 'Toner cartridge', Unit 'each', Unit price 89, Reorder level 4 and click Save item.
    expect: You arrive on Manage catalogue and 'Toner cartridge' is listed with unit price 89.00 and reorder level 4. Three items are listed.
    weight: 1
  - id: clerk-edits-pens
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Manage catalogue
    steps: Click the 'Ballpoint pens' row. Check the form is filled with its current values. Change Unit price to 5.00 and click Save item.
    expect: The Item details screen shows an 'Edit item' form pre-filled with the item's values. After saving you arrive on Manage catalogue and 'Ballpoint pens' shows unit price 5.00; the other values are unchanged.
    weight: 2
  - id: clerk-search-manage
    role: Warehouse Clerk
    screen: Manage catalogue
    flow: Manage catalogue
    steps: In Search items type 'paper'.
    expect: Only 'A4 paper' remains in the list and the count reflects one item. Clearing the search lists all three items again.
    weight: 1
  - id: clerk-stock-levels-new-items
    role: Warehouse Clerk
    screen: Stock levels
    flow: Receive goods
    steps: Open Stock levels from the navigation. Then type 'toner' in Search items.
    expect: All three new items are listed with 0 on hand and their reorder levels (10, 15, 4). With the search 'toner' only 'Toner cartridge' is listed.
    weight: 1
  - id: clerk-empty-ledger
    role: Warehouse Clerk
    screen: Item ledger
    flow: Receive goods
    steps: Clear the search, then click the 'Toner cartridge' row.
    expect: The Item ledger screen for Toner cartridge shows no entries and the empty message 'No entries'.
    weight: 1
  - id: requester-browses-catalogue
    role: Requester
    screen: Catalogue
    flow: Browse and request
    steps: Open Catalogue from the navigation.
    expect: The three items created by the clerk are listed with SKU, name, unit and unit price (Ballpoint pens 5.00, A4 paper 6.20, Toner cartridge 89.00).
    weight: 2
  - id: requester-searches-catalogue
    role: Requester
    screen: Catalogue
    flow: Browse and request
    steps: In Search items type 'paper'.
    expect: Only 'A4 paper' is listed. Clearing the search lists all three again.
    weight: 1
  - id: requester-opens-new-request-from-item
    role: Requester
    screen: New purchase request
    flow: Browse and request
    steps: Click the 'Ballpoint pens' row in the catalogue.
    expect: The New purchase request screen opens with Ballpoint pens chosen in the Item field, no lines yet ('No lines yet') and total value 0.00.
    weight: 1
  - id: requester-adds-lines
    role: Requester
    screen: New purchase request
    flow: Browse and request
    steps: With Ballpoint pens chosen set Quantity 20 and click Add line. Choose 'A4 paper', set Quantity 10 and click Add line.
    expect: "Two lines are listed: Ballpoint pens 20 at 5.00 = 100.00 and A4 paper 10 at 6.20 = 62.00. Total value shows 162.00."
    weight: 1
  - id: requester-removes-line
    role: Requester
    screen: New purchase request
    flow: Browse and request
    steps: Choose 'Toner cartridge', Quantity 1, click Add line, then use Remove on the Toner cartridge line.
    expect: The Toner cartridge line disappears; the two earlier lines remain and the total is 162.00 again.
    weight: 1
  - id: requester-submits-request
    role: Requester
    screen: My requests
    flow: Browse and request
    steps: With the two lines still present (pens 20, paper 10) click Submit request.
    expect: You arrive on My requests, where a new request with total 162.00 and status pending is listed.
    weight: 2
  - id: requester-submit-empty-blocked
    role: Requester
    screen: New purchase request
    flow: Browse and request
    steps: Click New request, do not add any line and click Submit request.
    expect: No request is created; the screen stays open and shows a validation message that at least one line is required (Validation errors state).
    weight: 1
  - id: requester-submits-over-limit-request
    role: Requester
    screen: My requests
    flow: Browse and request
    steps: On New purchase request choose 'A4 paper', Quantity 1000, click Add line, then click Submit request.
    expect: You arrive on My requests and a pending request with total 6200.00 is listed.
    weight: 1
  - id: requester-submits-third-request
    role: Requester
    screen: My requests
    flow: Browse and request
    steps: Click New request, choose 'Toner cartridge', Quantity 1, click Add line, then click Submit request.
    expect: You arrive on My requests and a pending request with total 89.00 is listed. Three pending requests are listed.
    weight: 1
  - id: requester-views-pending-detail
    role: Requester
    screen: My request
    flow: Browse and request
    steps: Click the request with total 162.00.
    expect: The request detail shows a pending status, the raised date, total value 162.00, the decision 'Awaiting a decision', and its lines Ballpoint pens ordered 20 received 0 and A4 paper ordered 10 received 0.
    weight: 2
  - id: approver-sees-queue
    role: Approver
    screen: Pending requests
    flow: Approval queue
    steps: Open Approvals from the navigation.
    expect: The three pending requests (162.00, 6200.00, 89.00) are listed with requester, total and raised date. The 6200.00 request is marked as over the limit. Approval limit shows 5000.00.
    weight: 2
  - id: approver-reviews-request
    role: Approver
    screen: Review request
    flow: Approval queue
    steps: Click the request with total 6200.00.
    expect: The Review request screen shows a warning that the total exceeds the approval limit of 5000.00, the requester, total value 6200.00, the item line (A4 paper 1000 at 6.20 = 6200.00) and Approve and Reject buttons with a reason field.
    weight: 1
  - id: approver-approve-over-limit-refused
    role: Approver
    screen: Review request
    flow: Approval queue
    steps: On the 6200.00 request click Approve.
    expect: A 'Cannot approve' error says the total is above the approval limit; the request stays on screen and is not approved.
    weight: 2
  - id: approver-rejects-request
    role: Approver
    screen: Pending requests
    flow: Approval queue
    steps: On the 6200.00 request enter Reason 'Too large' and click Reject.
    expect: You arrive on Pending requests and the 6200.00 request is no longer listed; two pending requests remain.
    weight: 2
  - id: approver-approves-request
    role: Approver
    screen: Pending requests
    flow: Approval queue
    steps: Click the request with total 162.00 and click Approve.
    expect: You arrive on Pending requests and the 162.00 request is no longer listed; only the 89.00 request remains.
    weight: 2
  - id: requester-sees-statuses
    role: Requester
    screen: My requests
    flow: Browse and request
    steps: Open My requests. Then set the Status filter to approved, then to rejected, then to pending, then back to all.
    expect: With approved only the 162.00 request shows; with rejected only the 6200.00 request; with pending only the 89.00 request; with all, all three show with matching status badges.
    weight: 2
  - id: requester-sees-rejection
    role: Requester
    screen: My request
    flow: Browse and request
    steps: Click the request with total 6200.00 in My requests.
    expect: The detail shows a rejected status and a decision that includes the reason 'Too large'.
    weight: 1
  - id: clerk-sees-receiving-queue
    role: Warehouse Clerk
    screen: Approved orders
    flow: Receive goods
    steps: Open Receiving from the navigation.
    expect: Only the approved 162.00 order is listed with its status; the rejected and pending requests are not listed.
    weight: 2
  - id: clerk-opens-receive-goods
    role: Warehouse Clerk
    screen: Receive goods
    flow: Receive goods
    steps: Click the 162.00 order.
    expect: The Receive goods screen lists Ballpoint pens (ordered 20, received so far 0, outstanding 20) and A4 paper (ordered 10, received 0, outstanding 10), with a quantity field per line.
    weight: 1
  - id: clerk-receive-too-many-blocked
    role: Warehouse Clerk
    screen: Receive goods
    flow: Receive goods
    steps: Enter Ballpoint pens quantity 50, A4 paper 0 and click Confirm receipt.
    expect: The receipt is not recorded; the screen stays open and shows a validation message that the quantity is more than what is outstanding. Outstanding quantities are unchanged.
    weight: 1
  - id: clerk-receives-partial
    role: Warehouse Clerk
    screen: Approved orders
    flow: Receive goods
    steps: Enter Ballpoint pens quantity 10, A4 paper quantity 5 and click Confirm receipt.
    expect: You arrive on Approved orders and the order is still listed, now with status partially-received.
    weight: 2
  - id: clerk-stock-after-partial
    role: Warehouse Clerk
    screen: Stock levels
    flow: Receive goods
    steps: Open Stock levels from the navigation.
    expect: Ballpoint pens shows 10 on hand, A4 paper 5 on hand, Toner cartridge 0 on hand. A4 paper and Toner cartridge are marked Low; Ballpoint pens (10, reorder level 10) is not.
    weight: 2
  - id: clerk-views-ledger
    role: Warehouse Clerk
    screen: Item ledger
    flow: Receive goods
    steps: Click the 'A4 paper' row.
    expect: The ledger for A4 paper shows one entry with change +5, balance after 5 and reason goods-receipt, with a receipt reference.
    weight: 2
  - id: clerk-receives-remainder
    role: Warehouse Clerk
    screen: Approved orders
    flow: Receive goods
    steps: Go back to Approved orders, open the order, check outstanding shows 10 for pens and 5 for paper, enter pens 10, paper 5 and click Confirm receipt.
    expect: You arrive on Approved orders and the fully received order is no longer listed (empty message 'No orders to receive').
    weight: 2
  - id: clerk-ledger-two-entries
    role: Warehouse Clerk
    screen: Item ledger
    flow: Receive goods
    steps: Open Stock levels, then click the 'A4 paper' row.
    expect: "On hand for A4 paper is 10. The ledger lists two entries, newest first: +5 with balance 10, then +5 with balance 5."
    weight: 1
  - id: clerk-low-stock-view
    role: Warehouse Clerk
    screen: Low stock
    flow: Receive goods
    steps: Open Low stock from the navigation.
    expect: A4 paper (10 on hand, reorder level 15) and Toner cartridge (0 on hand, reorder level 4) are listed; Ballpoint pens (20 on hand, reorder 10) is not.
    weight: 2
  - id: requester-sees-received
    role: Requester
    screen: My request
    flow: Browse and request
    steps: Open My requests and click the 162.00 request.
    expect: The status shows received, the decision shows it was approved, and the lines show Ballpoint pens ordered 20 received 20 and A4 paper ordered 10 received 10.
    weight: 1
  - id: requester-refused-queue
    role: Requester
    screen: Pending requests
    flow: Role reach
    steps: Open the address the Pending requests screen had in approver-sees-queue.
    expect: The Requester does not get the Pending requests screen or its data; access is refused.
    weight: 1
  - id: approver-refused-catalogue
    role: Approver
    screen: Catalogue
    flow: Role reach
    steps: Open the address the Catalogue had in requester-browses-catalogue.
    expect: The Approver does not get the Catalogue screen or its items; access is refused.
    weight: 1
  - id: clerk-refused-my-requests
    role: Warehouse Clerk
    screen: My requests
    flow: Role reach
    steps: Open the address My requests had in requester-sees-statuses.
    expect: The Warehouse Clerk does not get the My requests screen or its data; access is refused.
    weight: 1
  - id: requester-account
    role: Requester
    screen: Account
    flow: Account and settings
    steps: Open the user menu in the app shell and choose the account entry.
    expect: The Account screen shows the signed-in user's name, email and the role Requester.
    weight: 1
  - id: requester-settings
    role: Requester
    screen: Home
    flow: Account and settings
    steps: Open the user menu and choose settings. Switch on Compact tables and click Save settings.
    expect: The Settings screen shows a Compact tables switch; after saving you arrive on Home without error.
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: No access
    flow: Role reach
    steps: Look at the screen shown after signing in.
    expect: A no-access page is shown instead of the app; no procurement screens or data are visible.
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: Home
    flow: Role reach
    steps: Load the app while signed out and wait for it to settle.
    expect: The app's sign-in guard brings it back through sign-in into a session without a crash or blank page.
    weight: 1
  - id: requester-signs-out
    role: Requester
    screen: No access
    flow: Sign out
    steps: Open the user menu and choose sign out.
    expect: The previous Requester screens and data are gone and the no-access state shows; no sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
