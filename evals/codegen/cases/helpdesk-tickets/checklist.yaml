# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Employee, Support Agent, Team Lead, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - SLA breach cannot be created from an empty database through the UI (it needs a ticket to pass its due time), so breached badges, the '(overdue)' marker, a non-zero SLA breached figure and a filter result containing breached tickets are not walkable. A person could add these by hand after a ticket has gone past its due time.
#  - Agents appear in the assign list only after they have used the app (profiles are recorded on first use); the assign items assume the Support Agent has already landed, which the earlier items do. The prototype's Assignee filter lists fixed agent names; whether it matches the real agents is not walkable.
#  - Team Lead, Support Agent and Employee scopes: the Team Lead holds the scopes for the Ticket queue, Work a ticket and Assign ticket screens, and the Support Agent holds them for Team queue, Review ticket and Reassign ticket, so no refusal items are written for those; the Employee is refused only the queue screens, with one item.
#  - The 'Help desk service failed' state needs the backend to fail and is not walkable. The validation-error state on Assign ticket cannot be reached because the agent select always has a selection.
#  - The PRD says a Team Lead can see SLA breaches highlighted and the prototype draws no comment box for the Team Lead; the prototype wins. The Settings 'Compact tables' switch has no stated visible effect beyond saving.
#  - Employee-only second-user isolation (employees seeing only their own tickets) is not walked, because only one Employee identity can be selected by role name.
#  - The SLA due values for each priority (3 days, 1 day, 8 hours, 2 hours) are assumed in the PRD and an open question; items only expect an SLA due time to be shown, not its value.

items:
  - id: employee-lands-on-my-tickets
    role: Employee
    screen: My tickets
    flow: Raise and follow a ticket
    steps: Look at the landing screen before creating anything.
    expect: "The My tickets screen shows: a Your tickets list with no rows, and the empty state 'No tickets yet' (Nothing to show state). Active and Resolved counters read 0."
    weight: 1
  - id: employee-account
    role: Employee
    screen: Account
    flow: Account
    steps: Open the user menu in the app shell and choose Account.
    expect: The Account screen shows the signed-in user's name, email and the role Employee.
    weight: 1
  - id: employee-settings
    role: Employee
    screen: Settings
    flow: Settings
    steps: Open the user menu and choose Settings. Switch 'Compact tables' on, then press Save settings.
    expect: The Settings screen shows the Compact tables switch; after Save settings the app arrives on the Account screen without error.
    weight: 1
  - id: employee-new-ticket-validation
    role: Employee
    screen: New ticket
    flow: Raise a ticket
    steps: From the My tickets screen press New ticket. Leave Title and Describe the problem blank and press Submit ticket.
    expect: The ticket is not created; the New ticket screen stays open and shows validation errors asking for a title and a description (Validation errors state). The Priority field is offered with Medium selected.
    weight: 1
  - id: employee-raises-high-ticket
    role: Employee
    screen: My ticket
    flow: Raise a ticket (story 1, 12)
    steps: On New ticket enter Title 'VPN not connecting', Describe the problem 'Cannot connect to the VPN from home since this morning.', Priority High, then press Submit ticket.
    expect: The My ticket screen opens for 'VPN not connecting' showing status Open, priority High, the description, an SLA due time, and an Unassigned assignee.
    weight: 1
  - id: employee-ticket-empty-comments
    role: Employee
    screen: My ticket
    flow: Comments (story 3)
    steps: On the My ticket screen for 'VPN not connecting', look at the Comments section.
    expect: The Comments section shows the empty state 'No comments yet' and a comment box. The Reopen ticket button is not usable because the ticket is not resolved.
    weight: 1
  - id: employee-comments-on-ticket
    role: Employee
    screen: My ticket
    flow: Comments (story 3)
    steps: In 'Write a comment' type 'Still cannot connect after a restart.' and press Add comment.
    expect: The comment appears in the Comments thread with the employee as its author, and the 'No comments yet' empty state is gone.
    weight: 1
  - id: employee-raises-low-ticket
    role: Employee
    screen: My ticket
    flow: Raise a ticket (story 1)
    steps: Use the My tickets navigation item, press New ticket, enter Title 'Request monitor stand', Describe the problem 'Need an adjustable stand for my second monitor.', Priority Low, press Submit ticket.
    expect: The My ticket screen opens for 'Request monitor stand' with status Open, priority Low and an SLA due time.
    weight: 1
  - id: employee-sees-own-tickets
    role: Employee
    screen: My tickets
    flow: Raise and follow a ticket (story 2, 12)
    steps: Open My tickets from the navigation (or the breadcrumb). Then press the row 'VPN not connecting'.
    expect: The list shows both 'VPN not connecting' and 'Request monitor stand', each with status, priority and an SLA due time, and the section count reads 2. Pressing the row opens the My ticket screen for that ticket.
    weight: 1
  - id: employee-cancel-new-ticket
    role: Employee
    screen: My tickets
    flow: Raise a ticket
    steps: On My tickets press New ticket, type Title 'Discarded', then press Cancel.
    expect: The app returns to My tickets and no ticket titled 'Discarded' is listed.
    weight: 1
  - id: agent-lands-on-queue
    role: Support Agent
    screen: Ticket queue
    flow: Work the queue
    steps: Look at the landing screen.
    expect: The Ticket queue screen lists 'VPN not connecting' and 'Request monitor stand' with requester, status Open, priority, assignee Unassigned and SLA due; the tickets count shows the rows. Open, In progress and SLA breached figures are shown.
    weight: 1
  - id: agent-filters-queue
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue (story 5)
    steps: On the Ticket queue set Priority to High. Then reset Priority to All and set Assignee to Unassigned. Then set Status to Resolved.
    expect: With Priority High only 'VPN not connecting' is listed. With Assignee Unassigned both tickets are listed. With Status Resolved no ticket is listed and the 'No tickets match' empty state shows.
    weight: 1
  - id: agent-filters-breached
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue (story 5)
    steps: Reset Status to All and Assignee to All. Switch 'SLA breached only' on.
    expect: The tickets just raised, which are not past their SLA due time, are not listed and the 'No tickets match' empty state shows.
    weight: 1
  - id: agent-opens-ticket-work
    role: Support Agent
    screen: Work a ticket
    flow: Work the queue
    steps: Switch 'SLA breached only' off, then press the row 'VPN not connecting'.
    expect: The Work a ticket screen opens for 'VPN not connecting' showing status Open, priority High, requester, Unassigned, SLA due, the description, the earlier employee comment in the thread, a Priority field, and Triage, Start work and Resolve buttons. Start work and Resolve are not usable yet.
    weight: 1
  - id: agent-triages-ticket
    role: Support Agent
    screen: Work a ticket
    flow: Triage (story 6)
    steps: On 'VPN not connecting' set Priority to Critical and press Triage.
    expect: The status badge shows Triaged and the priority badge shows Critical; the SLA due time reflects the new priority.
    weight: 1
  - id: agent-assigns-ticket
    role: Support Agent
    screen: Work a ticket
    flow: Assign (story 7)
    steps: On 'VPN not connecting' press Assign. On the Assign ticket screen leave the Support agent select on its first option (or choose any listed agent) and press Assign.
    expect: The Assign ticket screen shows a Support agent select with at least the agent who is signed in; after Assign the app returns to Work a ticket and the Assignee detail shows the chosen agent's name instead of Unassigned.
    weight: 1
  - id: agent-assign-cancel
    role: Support Agent
    screen: Work a ticket
    flow: Assign (story 7)
    steps: On 'VPN not connecting' press Assign, then press Cancel.
    expect: The app returns to Work a ticket for the same ticket with the assignee unchanged.
    weight: 1
  - id: agent-starts-and-resolves
    role: Support Agent
    screen: Work a ticket
    flow: Move to in progress, resolve (story 8)
    steps: On 'VPN not connecting' press Start work, then press Resolve.
    expect: After Start work the status badge shows In progress; after Resolve it shows Resolved.
    weight: 1
  - id: agent-comments-on-ticket
    role: Support Agent
    screen: Work a ticket
    flow: Comments (story 9)
    steps: On 'VPN not connecting' write 'Please restart the VPN client and try again.' in the comment box and press Add comment.
    expect: The new comment appears in the Comments thread with the agent as author, alongside the employee's earlier comment.
    weight: 1
  - id: agent-triages-second-ticket
    role: Support Agent
    screen: Work a ticket
    flow: Triage (story 6)
    steps: Use the breadcrumb Queue, open 'Request monitor stand', keep Priority Low and press Triage.
    expect: The status badge shows Triaged with priority Low.
    weight: 1
  - id: agent-queue-reflects-changes
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue (story 5)
    steps: Return to the Queue through the navigation. Set Status to Resolved.
    expect: Only 'VPN not connecting' is listed, with status Resolved and the assignee chosen earlier.
    weight: 1
  - id: employee-sees-agent-activity
    role: Employee
    screen: My ticket
    flow: Comments, SLA (story 3, 12)
    steps: From My tickets open 'VPN not connecting'.
    expect: The ticket shows status Resolved, priority Critical, the assignee, an SLA due time, and both comments including the support agent's reply.
    weight: 1
  - id: employee-reopens-ticket
    role: Employee
    screen: My ticket
    flow: Reopen (story 4)
    steps: On 'VPN not connecting' press Reopen ticket, then go back to My tickets.
    expect: The status badge shows Reopened and in My tickets the row shows status Reopened. The Reopen ticket button is no longer usable.
    weight: 1
  - id: employee-refused-queue
    role: Employee
    screen: Ticket queue
    flow: Role reach
    steps: Open the address the Ticket queue had in agent-lands-on-queue.
    expect: The Employee does not see the queue or any other person's tickets; the app refuses the screen.
    weight: 1
  - id: agent-lands-reopened
    role: Support Agent
    screen: Ticket queue
    flow: Work the queue (story 8)
    steps: On the Ticket queue open 'VPN not connecting', then press Start work.
    expect: The ticket was listed with status Reopened and after Start work its status badge shows In progress.
    weight: 1
  - id: agent-refused-my-tickets
    role: Support Agent
    screen: My tickets
    flow: Role reach
    steps: Open the address My tickets had in employee-lands-on-my-tickets.
    expect: The Support Agent does not see the My tickets screen; the app refuses it.
    weight: 1
  - id: lead-lands-on-team-queue
    role: Team Lead
    screen: Team queue
    flow: Watch the queue and SLA breaches (story 10)
    steps: Look at the landing screen.
    expect: The Team queue screen lists 'VPN not connecting' and 'Request monitor stand' with requester, status, priority, assignee and SLA due, plus Open, In progress and SLA breached figures.
    weight: 1
  - id: lead-filters-queue
    role: Team Lead
    screen: Team queue
    flow: Filter the queue (story 10)
    steps: On the Team queue set Status to In progress, then reset it to All and set Priority to Low.
    expect: With In progress only 'VPN not connecting' is listed; with Priority Low only 'Request monitor stand' is listed.
    weight: 1
  - id: lead-opens-ticket
    role: Team Lead
    screen: Review ticket
    flow: Watch the queue (story 10)
    steps: Reset Priority to All and press the row 'VPN not connecting'.
    expect: The Review ticket screen shows the ticket's status, priority, requester, assignee, SLA due, description, and the comment thread with the employee's and the agent's comments. There is no comment box and no Triage, Start or Resolve control.
    weight: 1
  - id: lead-reassigns-ticket
    role: Team Lead
    screen: Review ticket
    flow: Reassign (story 11)
    steps: On 'VPN not connecting' press Reassign. On Reassign ticket choose any listed agent and press Assign.
    expect: The Reassign ticket screen shows a Support agent select; after Assign the app returns to Review ticket and the Assignee shows the chosen agent.
    weight: 1
  - id: lead-reassign-cancel
    role: Team Lead
    screen: Review ticket
    flow: Reassign (story 11)
    steps: On Review ticket press Reassign, then Cancel.
    expect: The app returns to Review ticket with the assignee unchanged.
    weight: 1
  - id: lead-refused-my-tickets
    role: Team Lead
    screen: My tickets
    flow: Role reach
    steps: Open the address My tickets had in employee-lands-on-my-tickets.
    expect: The Team Lead does not see the My tickets screen; the app refuses it.
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: No access
    flow: Role reach
    steps: Look at the landing screen.
    expect: A no-access page is shown instead of the app; no tickets or navigation to ticket screens are available.
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: My tickets
    flow: Sign-in guard
    steps: Load the app while signed out and wait for it to settle.
    expect: The address loses auth=out and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: employee-signs-out
    role: Employee
    screen: No access
    flow: Sign out
    steps: Open the user menu and choose sign out.
    expect: The app goes to the start page and shows the no-access state; the employee's tickets and screens are no longer shown and no sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
