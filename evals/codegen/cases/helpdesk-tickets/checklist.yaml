# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Employee, Support Agent, Team Lead, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - The list of assignable agents comes from the API and nothing in the UI creates agents, so no item completes an assignment or reassignment (stories 7 and 11, assign-ticket and reassign-ticket flows) or uses the Assignee filter; a person could add these (including assignee shown on the ticket and Employee seeing the assignee) if agent users are known to be listed.
#  - No UI way to make a ticket breach its SLA, so the SLA breach filter, the 'Breached' badge and the SLA breaches stat can only be checked for the no-breach case; a person could add a breach item if a ticket is allowed to age past its due time.
#  - Employee is refused Ticket queue and Ticket workspace, and Support Agent and Team Lead are refused My tickets and Ticket detail; the Employee refusal for the Ticket detail screen is not written because its address is only reached through My tickets, and no other role refusal items exist since the other screens (Account, Settings) are not tied to scopes.
#  - The prototype's Settings screen offers 'Email me a daily ticket digest' although the PRD puts notifications out of scope; the item only checks the screen loads and Save returns to the landing screen.
#  - The PRD says Support Agent comments and Team Lead views comments; the prototype shows no comment form for Team Lead, so no Team Lead comment item is written.
#  - The prototype draws the Account and Settings screens for all roles, but only the Employee walk is written for them.
#  - Whether the SLA due time shown after triage is earlier or later depends on the API's targets (open question 1), so the triage item expects only that it is recomputed.

items:
  - id: employee-lands-on-my-tickets
    role: Employee
    screen: My tickets
    flow: See my tickets and their status
    steps: Look at the screen the app opened on. Look at the navigation and the tickets section.
    expect: The My tickets screen shows. With nothing raised yet the table shows the empty state 'No tickets yet' with a Raise ticket button. No crash.
    weight: 1
  - id: employee-raises-ticket-vpn
    role: Employee
    screen: My tickets
    flow: Raise a ticket
    steps: On My tickets press 'Raise ticket'. In the dialog enter Title 'VPN not connecting', Description 'Cannot connect to the office VPN from home.', Priority high. Press 'Raise'.
    expect: The dialog closes and a row 'VPN not connecting' is listed with priority high, status open and an SLA due value.
    weight: 2
  - id: employee-raises-ticket-printer
    role: Employee
    screen: My tickets
    flow: Raise a ticket
    steps: Press 'Raise ticket'. Enter Title 'Cannot print', Description 'The 3rd floor printer is not reachable.', leave Priority at its preset value, and press 'Raise'.
    expect: The dialog closes and a row 'Cannot print' is listed with status open, next to 'VPN not connecting'. Both rows show an SLA due value.
    weight: 1
  - id: employee-lists-own-tickets
    role: Employee
    screen: My tickets
    flow: See my tickets and their status
    steps: Look at the table on My tickets after raising the two tickets.
    expect: Both 'VPN not connecting' and 'Cannot print' are listed with Title, Priority, a Status badge and SLA due. The section count reads 2.
    weight: 1
  - id: employee-opens-ticket-detail
    role: Employee
    screen: Ticket detail
    flow: See the SLA due time
    steps: Click the 'VPN not connecting' row.
    expect: Ticket detail opens for 'VPN not connecting', showing its description, status open, priority high, assignee Unassigned and an SLA due time. Breadcrumbs show My tickets.
    weight: 2
  - id: employee-comments-on-ticket
    role: Employee
    screen: Ticket detail
    flow: Comment on my ticket
    steps: On the 'VPN not connecting' detail, enter 'Still failing after restart.' in 'Add a comment' and press 'Add comment'.
    expect: The comment 'Still failing after restart.' appears in the Comments thread with the employee's name and the comment count increases to 1.
    weight: 2
  - id: employee-breadcrumb-back
    role: Employee
    screen: My tickets
    flow: See my tickets and their status
    steps: On Ticket detail press the 'My tickets' breadcrumb.
    expect: You arrive back on My tickets with both tickets still listed.
    weight: 1
  - id: employee-views-account
    role: Employee
    screen: Account
    flow: Account
    steps: Open the user menu and choose Account.
    expect: The Account screen shows Name, Email and Role 'Employee'.
    weight: 1
  - id: employee-saves-settings
    role: Employee
    screen: My tickets
    flow: Settings
    steps: Open the user menu and choose Settings. Press 'Save settings'.
    expect: The Settings screen shows, and after saving you arrive back on My tickets.
    weight: 1
  - id: agent-lands-on-queue
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue
    steps: Look at the screen the app opened on.
    expect: The Ticket queue screen shows with the 'VPN not connecting' and 'Cannot print' tickets raised earlier, both open and unassigned, plus Open and SLA breaches stat tiles and filters for Status, Priority, Assignee and SLA breaches only.
    weight: 1
  - id: agent-opens-workspace
    role: Support Agent
    screen: Ticket workspace
    flow: Triage a ticket
    steps: Click the 'VPN not connecting' row in the queue.
    expect: Ticket workspace opens showing description, requester, status open, priority high, assignee Unassigned, SLA due, an Assign button, a Triage form and the Comments thread including 'Still failing after restart.'.
    weight: 1
  - id: agent-triages-ticket
    role: Support Agent
    screen: Ticket workspace
    flow: Triage a ticket
    steps: On the 'VPN not connecting' workspace, set the Triage Priority to critical and press 'Save triage'.
    expect: Status shows triaged and Priority shows critical. The SLA due time is recomputed for the new priority.
    weight: 2
  - id: agent-opens-assign-dialog
    role: Support Agent
    screen: Ticket workspace
    flow: Assign a ticket
    steps: On the 'VPN not connecting' workspace press 'Assign'.
    expect: A dialog 'Assign VPN not connecting' opens with an Agent selector and an Assign button.
    weight: 1
  - id: agent-comments-on-ticket
    role: Support Agent
    screen: Ticket workspace
    flow: Comment as an agent
    steps: Close the dialog if open. In 'Add a comment' enter 'Checking your VPN profile now.' and press 'Add comment'.
    expect: The comment appears in the Comments thread with the agent's name, and the count increases.
    weight: 2
  - id: agent-filters-by-status
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue
    steps: Press the 'Queue' breadcrumb. Set Status to triaged.
    expect: "'VPN not connecting' is listed and 'Cannot print' is not."
    weight: 2
  - id: agent-filters-by-priority
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue
    steps: Set Status back to all. Set Priority to critical.
    expect: "'VPN not connecting' is listed and 'Cannot print' is not."
    weight: 1
  - id: agent-filters-no-match
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue
    steps: Set Priority to low.
    expect: No tickets are listed and the empty state 'Nothing matches these filters' shows.
    weight: 1
  - id: agent-filters-sla-breaches
    role: Support Agent
    screen: Ticket queue
    flow: Filter the queue
    steps: Set Priority back to all. Turn on 'SLA breaches only'.
    expect: The freshly raised tickets, not yet past their SLA due time, are not listed.
    weight: 1
  - id: agent-starts-and-resolves
    role: Support Agent
    screen: Ticket workspace
    flow: Work a ticket to resolution
    steps: Turn 'SLA breaches only' off. Open the 'Cannot print' row. Press 'Save triage' keeping its priority. Press 'Start', then press 'Resolve'.
    expect: After triage the status shows triaged, after Start it shows in progress, and after Resolve it shows resolved. The Triage form and the Start and Resolve buttons are no longer offered.
    weight: 2
  - id: agent-sees-resolved-in-queue
    role: Support Agent
    screen: Ticket queue
    flow: Work a ticket to resolution
    steps: Press the 'Queue' breadcrumb and set Status to resolved.
    expect: "'Cannot print' is listed with a resolved status badge and 'VPN not connecting' is not."
    weight: 1
  - id: team-lead-lands-on-queue
    role: Team Lead
    screen: Ticket queue
    flow: Watch the queue for SLA breaches
    steps: Look at the screen the app opened on.
    expect: The Ticket queue screen shows every ticket raised, including 'VPN not connecting' and 'Cannot print', with Open and SLA breaches stat tiles and the same filters.
    weight: 1
  - id: team-lead-filters-breaches
    role: Team Lead
    screen: Ticket queue
    flow: Watch the queue for SLA breaches
    steps: Turn on 'SLA breaches only'.
    expect: The freshly raised tickets, not yet past their SLA due time, are not listed.
    weight: 1
  - id: team-lead-opens-workspace
    role: Team Lead
    screen: Ticket workspace
    flow: Reassign a ticket
    steps: Turn 'SLA breaches only' off and click the 'VPN not connecting' row.
    expect: Ticket workspace opens showing the ticket details, an Assign button and the Comments thread including 'Checking your VPN profile now.'. No Triage form and no comment form are offered.
    weight: 1
  - id: team-lead-opens-assign-dialog
    role: Team Lead
    screen: Ticket workspace
    flow: Reassign a ticket
    steps: Press 'Assign' on the 'VPN not connecting' workspace.
    expect: A dialog 'Assign VPN not connecting' opens with an Agent selector and an Assign button.
    weight: 1
  - id: employee-sees-agent-comment
    role: Employee
    screen: Ticket detail
    flow: Comment on my ticket
    steps: On My tickets open the 'VPN not connecting' row.
    expect: The Comments thread shows both 'Still failing after restart.' and the agent's 'Checking your VPN profile now.'.
    weight: 1
  - id: employee-sees-resolved-status
    role: Employee
    screen: My tickets
    flow: See my tickets and their status
    steps: Press the 'My tickets' breadcrumb and look at the table.
    expect: "'Cannot print' shows a resolved status and 'VPN not connecting' shows triaged."
    weight: 1
  - id: employee-reopens-ticket
    role: Employee
    screen: Ticket detail
    flow: Reopen a resolved ticket
    steps: Open the 'Cannot print' row. Press 'Reopen'. Enter 'Printer is still offline.' in the note and press 'Reopen' in the dialog.
    expect: The dialog closes and the ticket's status shows reopened. The Reopen button is no longer offered.
    weight: 2
  - id: employee-reopen-not-offered-unresolved
    role: Employee
    screen: Ticket detail
    flow: Reopen a resolved ticket
    steps: Press the 'My tickets' breadcrumb and open 'VPN not connecting'.
    expect: The ticket is not resolved and no Reopen button is offered.
    weight: 1
  - id: employee-refused-queue
    role: Employee
    screen: My tickets
    flow: Role reach
    steps: Open the address the Ticket queue had in agent-lands-on-queue.
    expect: The Ticket queue and its tickets are not shown to the Employee; access is refused.
    weight: 1
  - id: employee-refused-workspace
    role: Employee
    screen: My tickets
    flow: Role reach
    steps: Open the address the Ticket workspace had in agent-opens-workspace.
    expect: The Ticket workspace and its data are not shown to the Employee; access is refused.
    weight: 1
  - id: agent-refused-my-tickets
    role: Support Agent
    screen: Ticket queue
    flow: Role reach
    steps: Open the address My tickets had in employee-lands-on-my-tickets.
    expect: The My tickets screen and its data are not shown to the Support Agent; access is refused.
    weight: 1
  - id: team-lead-refused-my-tickets
    role: Team Lead
    screen: Ticket queue
    flow: Role reach
    steps: Open the address My tickets had in employee-lands-on-my-tickets.
    expect: The My tickets screen and its data are not shown to the Team Lead; access is refused.
    weight: 1
  - id: no-role-sees-no-access
    role: no role
    screen: Signed out
    flow: Role reach
    steps: Look at what the app shows.
    expect: A no-access page is shown instead of the app; no ticket screens or data appear.
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: Signed out
    flow: Role reach
    steps: Load the app signed out.
    expect: The address loses 'auth=out' and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: agent-signs-out
    role: Support Agent
    screen: Signed out
    flow: Sign out
    steps: Open the user menu and choose sign out.
    expect: The Support Agent's queue screens and data are gone and the no-access state shows. No sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
