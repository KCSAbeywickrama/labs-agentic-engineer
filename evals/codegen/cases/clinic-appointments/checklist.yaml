# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Patient, Doctor, Receptionist, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the prototype disagree:
#  - Receptionist reschedule (story 8) has no control in the prototype, so no item covers it; the Reschedule screen is drawn only for patients.
#  - Refusing cancel or reschedule within 2 hours of the start, and the 'Slot taken or inside 2-hour cutoff' state, cannot be walked reliably: the UI cannot create an appointment starting within 2 hours at a known time, so no item covers it.
#  - Check-in is only allowed on the day of the appointment, and the Publish slots form has no date field, so the walk assumes published slots fall on today; receptionist-check-in only works if that holds. The cancel items also depend on the slot starting more than 2 hours from the time of testing.
#  - The 'Clinic service failed' state needs the backend to fail and is not walkable.
#  - The Reschedule screen's 'No other slots' empty state and the 'Slot already taken' conflict need a second concurrent user or a booked-out doctor, so they are not walked.
#  - Story 12 (notes readable only by doctors) is covered by the Receptionist refusal item. Patients have no UI path to notes and no further refusal item is written.
#  - Role-reach refusal items exist for Patient, Doctor and Receptionist; the Receptionist's grants also reach Available slots (slots:browse), so no refusal is written for that screen. Other cross-role screens are not walked separately.
#  - Open Question 1 (how accounts and roles are assigned) is unanswered, and no UI creates accounts; the Account and Settings screens only show the signed-in role's details.
#  - The PRD says the Patient browses by doctor, but the Doctor filter's option names depend on the doctor's display name, which nothing seeds, so only its first value 'All doctors' is walked.
#  - Settings has one switch, Compact tables, with no stated effect, so the item expects only that Save settings leads to Account.

items:
  - id: doctor-lands-schedule
    role: Doctor
    screen: My day
    flow: My day
    steps: Look at the screen the app opens on after sign-in.
    expect: The My day screen shows, with an Appointments section, a Date filter and a Publish slots button. No crash or blank page.
    weight: 1
  - id: doctor-schedule-empty
    role: Doctor
    screen: My day
    flow: My day
    steps: On My day, leave the Date filter on its default value and look at the Appointments table.
    expect: The empty state reads 'No appointments' with 'Nothing is booked for this day.' and no rows are listed.
    weight: 1
  - id: doctor-my-slots-empty
    role: Doctor
    screen: My slots
    flow: Publish availability
    steps: Open 'My slots' from the navigation.
    expect: The My slots screen shows the empty state 'No slots published' with a Publish slots button, and no rows.
    weight: 1
  - id: doctor-publish-validation
    role: Doctor
    screen: Publish slots
    flow: Publish availability
    steps: On My slots, press Publish slots. Clear the Window start field, leave the other fields as they are, and press Publish.
    expect: "The Validation errors state shows: the form is not accepted, the missing Window start is flagged, and the app stays on Publish slots."
    weight: 1
  - id: doctor-publish-slots
    role: Doctor
    screen: My slots
    flow: Publish availability
    steps: On Publish slots, set Window start 09:00, Window end 12:00, Slot length 30, then press Publish.
    expect: The app arrives on My slots and lists the newly published slots, each with the status Available. The empty state is gone.
    weight: 2
  - id: doctor-filter-my-slots
    role: Doctor
    screen: My slots
    flow: Publish availability
    steps: On My slots, set the Date filter to 2020-01-01.
    expect: No slot rows are listed and the 'No slots published' empty state shows.
    weight: 1
  - id: doctor-remove-slot
    role: Doctor
    screen: My slots
    flow: Remove an unbooked slot
    steps: Clear the Date filter on My slots. Note the Time of the last Available slot in the list, then press Remove on that row.
    expect: That slot is no longer listed. The other Available slots remain.
    weight: 2
  - id: patient-lands-my-appointments
    role: Patient
    screen: My appointments
    flow: My appointments
    steps: Look at the screen the app opens on after sign-in.
    expect: The My appointments screen shows, with Upcoming and Past tabs and a Book a slot button.
    weight: 1
  - id: patient-empty-appointments
    role: Patient
    screen: My appointments
    flow: See upcoming and past appointments
    steps: On My appointments, look at the Upcoming tab, then open the Past tab.
    expect: Upcoming shows 'No upcoming appointments' and Past shows 'No past appointments'. Neither lists rows.
    weight: 1
  - id: patient-browse-slots
    role: Patient
    screen: Available slots
    flow: Browse and book
    steps: Press Book a slot. With the Doctor filter on its first value, All doctors, and no date, look at the table.
    expect: The Available slots screen lists the slots the doctor published and did not remove, each with Doctor, Date, Time and a Book action.
    weight: 1
  - id: patient-filter-slots-date
    role: Patient
    screen: Available slots
    flow: Browse and book
    steps: On Available slots, set the Date filter to 2020-01-01.
    expect: No slot rows are listed and the 'No slots available' empty state shows.
    weight: 1
  - id: patient-filter-slots-search
    role: Patient
    screen: Available slots
    flow: Browse and book
    steps: Clear the Date filter. In the Search field type 'zzzz'.
    expect: No slot rows are listed and the 'No slots available' empty state shows.
    weight: 1
  - id: patient-book-slot
    role: Patient
    screen: My appointments
    flow: Book a slot
    steps: Clear the Search field. On Available slots, press Book on the first listed slot. Note its Date and Time.
    expect: The app arrives on My appointments. The Upcoming tab lists an appointment with that doctor, date and time and the status Booked.
    weight: 2
  - id: patient-booked-slot-gone
    role: Patient
    screen: Available slots
    flow: Book a slot
    steps: On My appointments press Book a slot and look at the list.
    expect: The slot booked in patient-book-slot is no longer offered. The doctor's other available slots still are.
    weight: 1
  - id: patient-open-reschedule
    role: Patient
    screen: Reschedule appointment
    flow: Reschedule
    steps: Go back to My appointments (breadcrumb 'My appointments'). In the Upcoming tab open the appointment booked in patient-book-slot.
    expect: The Reschedule appointment screen shows the current appointment's Doctor, Date and Time and a table of other available slots with the same doctor, each with a Confirm new slot action.
    weight: 1
  - id: patient-reschedule
    role: Patient
    screen: My appointments
    flow: Reschedule
    steps: On Reschedule appointment, press Confirm new slot on the first listed slot. Note its Date and Time.
    expect: The app arrives on My appointments. The appointment now shows the new date and time, is still Booked, and there is still one upcoming appointment, not two.
    weight: 2
  - id: patient-book-second
    role: Patient
    screen: My appointments
    flow: Book a slot
    steps: Press Book a slot, then Book on the first listed slot. Note its Date and Time.
    expect: The app arrives on My appointments and the Upcoming tab lists two appointments, the new one with status Booked.
    weight: 1
  - id: patient-cancel
    role: Patient
    screen: My appointments
    flow: Cancel
    steps: In the Upcoming tab press Cancel on the appointment booked in patient-book-second.
    expect: It leaves the Upcoming tab. The Past tab lists it with the status Cancelled. The rescheduled appointment stays in Upcoming.
    weight: 2
  - id: patient-cancelled-slot-freed
    role: Patient
    screen: Available slots
    flow: Cancel
    steps: Press Book a slot and look at the list.
    expect: The slot of the appointment cancelled in patient-cancel is offered again.
    weight: 1
  - id: patient-account
    role: Patient
    screen: Account
    flow: Account
    steps: Open the user menu and choose the account entry.
    expect: The Account screen shows the signed-in user's Name, Email and Role (Patient) and a Go to my work button.
    weight: 1
  - id: patient-settings
    role: Patient
    screen: Settings
    flow: Settings
    steps: Open the user menu and choose settings. Switch Compact tables on and press Save settings.
    expect: The Settings screen shows a Compact tables switch and 'Signed in as' Patient. After Save settings the app arrives on Account.
    weight: 1
  - id: receptionist-lands-front-desk
    role: Receptionist
    screen: Front desk
    flow: Front desk
    steps: Look at the screen the app opens on after sign-in.
    expect: The Front desk screen shows, with a Date filter, a Status filter and a Book for patient button.
    weight: 1
  - id: receptionist-sees-appointments
    role: Receptionist
    screen: Front desk
    flow: Front desk
    steps: On Front desk set Date to the date of the rescheduled appointment from patient-reschedule, Status 'Any status'.
    expect: The table lists the patient's rescheduled appointment with its time, patient, doctor and status Booked.
    weight: 1
  - id: receptionist-filter-status
    role: Receptionist
    screen: Front desk
    flow: Front desk
    steps: Keep that Date. Set Status to Booked, then set it to Cancelled.
    expect: With Booked the rescheduled appointment is listed. With Cancelled, if the date of the appointment cancelled in patient-cancel is set, that appointment is listed with status Cancelled and the Booked one is not.
    weight: 1
  - id: receptionist-filter-date-empty
    role: Receptionist
    screen: Front desk
    flow: Front desk
    steps: Set Status to 'Any status' and Date to 2020-01-01.
    expect: The 'No appointments' empty state shows with 'Nothing matches this day and status.' and no rows.
    weight: 1
  - id: receptionist-open-book
    role: Receptionist
    screen: Book for patient
    flow: Book for a patient
    steps: Press Book for patient.
    expect: The Book for patient screen shows a table of available slots with Choose actions and a form with Patient username, Patient name and Chosen slot.
    weight: 1
  - id: receptionist-book-validation
    role: Receptionist
    screen: Book for patient
    flow: Book for a patient
    steps: Without filling anything, press Book slot.
    expect: "The Validation errors state shows: the patient's username, name and a slot are flagged as required and the app stays on Book for patient."
    weight: 1
  - id: receptionist-book-for-patient
    role: Receptionist
    screen: Front desk
    flow: Book for a patient
    steps: Press Choose on the first listed slot. Enter Patient username 'walkin-pat' and Patient name 'Walk In', then press Book slot. Note the slot's Date.
    expect: The app arrives on Front desk. With Date set to that date, an appointment for Walk In appears with status Booked.
    weight: 2
  - id: receptionist-check-in
    role: Receptionist
    screen: Front desk
    flow: Check in
    steps: On Front desk with Date set to the date of the Walk In appointment, press Check in on its row.
    expect: The row's status becomes Checked in. This depends on the appointment being today (see gaps).
    weight: 2
  - id: receptionist-cancel
    role: Receptionist
    screen: Front desk
    flow: Front desk
    steps: On the row of the patient's rescheduled appointment from patient-reschedule, press Cancel appointment.
    expect: The row's status becomes Cancelled.
    weight: 1
  - id: doctor-booked-slot-not-removable
    role: Doctor
    screen: My slots
    flow: Remove an unbooked slot
    steps: Open My slots and find the slot booked for Walk In (note its date and time from receptionist-book-for-patient).
    expect: That slot shows status Booked and offers no way to remove it.
    weight: 1
  - id: doctor-schedule-shows-day
    role: Doctor
    screen: My day
    flow: My day
    steps: Open My day and set Date to the date of the Walk In appointment.
    expect: The table lists the Walk In appointment with its time and the status Checked in.
    weight: 1
  - id: doctor-note-validation
    role: Doctor
    screen: Visit note
    flow: Write a visit note
    steps: Open the Walk In row. Leave Note empty and press Save note.
    expect: The Visit note screen shows the patient's name, date, time and status, and the Validation errors state asks for a note. The app stays on Visit note.
    weight: 1
  - id: doctor-write-note
    role: Doctor
    screen: My day
    flow: Write a visit note
    steps: In Note type 'Sore throat, rest advised.' and press Save note.
    expect: The app arrives on My day.
    weight: 2
  - id: doctor-note-persists
    role: Doctor
    screen: Visit note
    flow: Write a visit note
    steps: On My day with the same Date, open the Walk In row again.
    expect: The Note field contains 'Sore throat, rest advised.'.
    weight: 1
  - id: patient-refused-my-day
    role: Patient
    screen: My day
    flow: Role reach
    steps: Open the address My day had in doctor-lands-schedule.
    expect: "The Patient is refused: no doctor schedule or appointments of other people are shown."
    weight: 1
  - id: doctor-refused-front-desk
    role: Doctor
    screen: Front desk
    flow: Role reach
    steps: Open the address the Front desk had in receptionist-lands-front-desk.
    expect: "The Doctor is refused: no Front desk appointments of all patients are shown."
    weight: 1
  - id: receptionist-refused-visit-note
    role: Receptionist
    screen: Visit note
    flow: Role reach
    steps: Open the address the Visit note had in doctor-note-persists.
    expect: "The Receptionist is refused: the note text 'Sore throat, rest advised.' is not shown."
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: Account
    flow: Sign-in
    steps: Look at the screen the app shows after sign-in.
    expect: "A no-access page shows instead of the app: no clinic data or role screens."
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: Account
    flow: Sign-in
    steps: Load the app signed out and wait for it to settle.
    expect: The address loses auth=out and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: sign-out
    role: Patient
    screen: Signed out
    flow: Sign-out
    steps: Open the user menu and choose sign out.
    expect: The previous role's screens and data are gone and the no-access state shows. No sign-in form appears.
    weight: 1
extras:
  mustCover: []
  mustNot: []
